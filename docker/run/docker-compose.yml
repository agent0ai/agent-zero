services:
  agent-zero:
    container_name: agent-zero
    image: agent0ai/agent-zero:latest
    privileged: false
    security_opt:
      - no-new-privileges:true
    volumes:
      # Keep the existing usr subfolder when migrating from a full /a0 mount.
      - ./agent-zero/usr:/a0/usr
    ports:
      - "50080:80"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
