services:
  agent-zero:
    container_name: agent-zero
    image: agent0ai/agent-zero:latest
    init: true
    privileged: false
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    volumes:
      - ./agent-zero:/a0
    ports:
      - "50080:80"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
