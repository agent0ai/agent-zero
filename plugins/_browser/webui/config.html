<html>
<head>
  <title>Browser Settings</title>
  <script type="module">
    import { store } from "/plugins/_browser/webui/browser-config-store.js";
    import { store as bridgeAccess } from "/plugins/_browser/webui/browser-bridge-access-store.js";
    import { store as bridgeSelection } from "/plugins/_browser/webui/browser-bridge-selection-store.js";
    import { store as bridgeSetup } from "/plugins/_browser/webui/browser-bridge-setup-store.js";
  </script>
</head>

<body>
  <div x-data>
    <template x-if="$store.browserConfig && config">
      <div
        class="browser-config-sections"
        x-init="$store.browserConfig.init(config); $store.browserBridgeSetup.mount()"
        x-effect="$store.browserConfig.bindConfig(config)"
        x-destroy="$store.browserConfig.cleanup(); $store.browserBridgeSetup.cleanup()"
      >
        <div
          class="browser-config-card browser-pairing-card"
          aria-labelledby="browser-pairing-title"
          :aria-busy="$store.browserConfig.pairingActionLoading || $store.browserConfig.pairingStatusLoading"
        >
          <div class="browser-pairing-heading">
            <div>
              <div id="browser-pairing-title" class="section-title">Chrome extension</div>
              <div class="section-description">
                Use Chrome on your computer, including when Agent Zero runs in Docker. Connect it once as your default browser, then approve the sites it can use.
              </div>
            </div>

          </div>

          <div class="browser-config-note" role="status" aria-live="polite">
            <x-icon
              :class="{ spinning: $store.browserConfig.pairingStatusLoading }"
              :name="$store.browserConfig.pairingStatusLoading ? 'progress_activity' : 'link'"
            ></x-icon>
            <span x-text="$store.browserConfig.pairingStatusLabel()"></span>
          </div>

          <details class="browser-setup-steps" :open="$store.browserConfig.pairingStatus.state !== 'paired'">
            <summary x-text="$store.browserConfig.pairingStatus.state === 'paired' ? 'Connect another browser' : 'Connect Chrome once'"></summary>
            <ol class="browser-setup-list">
              <li>
                <span>Install the Agent Zero Chrome extension.</span>
                <a class="browser-pairing-button" x-show="$store.browserBridgeSetup.setup?.extension_url"
                  :href="$store.browserBridgeSetup.setup?.extension_url" target="_blank" rel="noopener noreferrer">Open Chrome Web Store</a>
              </li>
              <li>
                <span>Install the companion on the computer running Chrome.</span>
                <label class="browser-config-field">
                  <span class="browser-config-field-label">Your computer</span>
                  <select x-model="$store.browserBridgeSetup.platform">
                    <option value="">Choose an operating system</option>
                    <option value="macos">macOS</option><option value="windows">Windows</option><option value="linux">Linux</option>
                  </select>
                </label>
                <p class="browser-config-field-help" role="status" x-text="$store.browserBridgeSetup.availabilityText()"></p>
                <template x-for="installer in $store.browserBridgeSetup.installers()" :key="installer.platform + ':' + installer.arch">
                  <a class="browser-pairing-button" :href="installer.url" target="_blank" rel="noopener noreferrer"
                    x-text="$store.browserBridgeSetup.installerLabel(installer)"></a>
                </template>
                <p class="browser-config-field-help" x-show="$store.browserBridgeSetup.installers().length">Publisher-provided downloads. The companion installer verifies the signed release on your computer before installation. Never install it inside Docker.</p>
              </li>
              <li>Open the extension's Settings, enter this Agent Zero address and the pairing code below, then choose Pair browser. Select Use this Chrome browser below once; Agent Zero remembers it across chats.</li>
            </ol>

          <label class="browser-config-field">
            <span class="browser-config-field-label">Browser name</span>
            <input
              type="text"
              maxlength="192"
              autocomplete="off"
              spellcheck="false"
              x-model="$store.browserConfig.pairingDisplayName"
              :disabled="$store.browserConfig.pairingActionLoading"
            />
            <span class="browser-config-field-help">
              Choose a name you will recognize, such as “My laptop”.
            </span>
          </label>

          <template x-if="$store.browserConfig.pairingCodeAvailable()">
            <div class="browser-pairing-code-card">
              <div class="browser-pairing-code-heading">
                <span>Single-use pairing code</span>
                <span x-text="$store.browserConfig.pairingExpiryLabel()"></span>
              </div>
              <code
                class="browser-pairing-code"
                tabindex="0"
                aria-label="Single-use browser companion pairing code"
                x-text="$store.browserConfig.pairingCode"
              ></code>
              <div class="browser-config-field-help">
                Anyone with this code can pair during its five-minute lifetime. Enter it only in the Agent Zero browser companion. It cannot be shown again after this panel closes.
              </div>
              <div class="browser-pairing-server" x-show="$store.browserConfig.pairingServerBaseUrl">
                <span>Agent Zero</span>
                <span x-text="$store.browserConfig.pairingServerBaseUrl"></span>
              </div>
              <div class="browser-pairing-actions">
                <button
                  type="button"
                  class="browser-pairing-button browser-pairing-button-primary"
                  @click="$store.browserConfig.copyBrowserBridgePairingCode()"
                >
                  <x-icon name="content_copy"></x-icon>
                  <span>Copy code</span>
                </button>
                <button
                  type="button"
                  class="browser-pairing-button"
                  :disabled="!$store.browserConfig.canCreateBrowserBridgePairing()"
                  @click="$store.browserConfig.createBrowserBridgePairing()"
                >
                  <x-icon name="refresh"></x-icon>
                  <span>Regenerate</span>
                </button>
                <button
                  type="button"
                  class="browser-pairing-button browser-pairing-button-danger"
                  :disabled="$store.browserConfig.pairingActionLoading"
                  @click="$store.browserConfig.cancelBrowserBridgePairing()"
                >
                  <x-icon name="cancel"></x-icon>
                  <span>Cancel</span>
                </button>
              </div>
            </div>
          </template>

          <div class="browser-pairing-actions" x-show="!$store.browserConfig.pairingCodeAvailable()">
            <button
              type="button"
              class="browser-pairing-button browser-pairing-button-primary"
              :disabled="!$store.browserConfig.canCreateBrowserBridgePairing()"
              @click="$store.browserConfig.createBrowserBridgePairing()"
            >
              <x-icon :name="$store.browserConfig.pairingActionLoading ? 'progress_activity' : 'key'"></x-icon>
              <span x-text="$store.browserConfig.pairingPrimaryActionLabel()"></span>
            </button>
            <button
              type="button"
              class="browser-pairing-button browser-pairing-button-danger"
              x-show="$store.browserConfig.pairingStatus.state === 'pairing_pending' && $store.browserConfig.pairingStatus.pairingId"
              :disabled="$store.browserConfig.pairingActionLoading"
              @click="$store.browserConfig.cancelBrowserBridgePairing()"
            >
              <x-icon name="cancel"></x-icon>
              <span>Cancel pending code</span>
            </button>
          </div>

          <div class="browser-config-warning">
            <x-icon name="computer"></x-icon>
            <span>
              Install the companion on the same computer as Chrome, not inside Docker. Your saved pairing stays on that computer; only revoking access or resetting its profile requires pairing again.
            </span>
          </div>
          </details>
          <template x-if="$store.browserBridgeAccess">
            <section class="browser-bridge-access" aria-labelledby="browser-access-title"
              x-init="$store.browserBridgeAccess.mount(); $store.browserBridgeSelection.mount(context)"
              x-destroy="$store.browserBridgeAccess.cleanup(); $store.browserBridgeSelection.cleanup()"
              :aria-busy="$store.browserBridgeAccess.loading || $store.browserBridgeAccess.busy">
              <div class="browser-pairing-heading">
                <h3 id="browser-access-title">Paired browsers &amp; site access</h3>
                <button type="button" class="browser-pairing-button" @click="$store.browserConfig.refreshProductionBrowserStatus()"
                  :disabled="$store.browserBridgeAccess.loading || $store.browserBridgeAccess.busy">
                  <x-icon name="refresh"></x-icon><span>Check connection</span>
                </button>
              </div>
              <p class="browser-config-field-help" role="status" x-show="$store.browserBridgeAccess.inventoryState === 'not_checked'">Checking paired browsers…</p>
              <p class="browser-config-field-help" role="status" x-show="$store.browserBridgeAccess.inventoryState === 'unavailable'">Browser access could not be checked. Refresh to retry.</p>
              <p class="browser-config-field-help" x-show="$store.browserBridgeAccess.inventoryState === 'loaded' &amp;&amp; !$store.browserBridgeAccess.bridges.length">No browsers paired yet. Use the pairing code above to connect your browser computer.</p>
              <template x-if="$store.browserBridgeAccess.bridges.length">
                <div>
                  <label class="browser-config-field">
                    <span class="browser-config-field-label">Paired browser</span>
                    <select :value="$store.browserBridgeAccess.selectedId" @change="$store.browserBridgeAccess.selectBridge($event.target.value)"
                      :disabled="$store.browserBridgeAccess.busy || $store.browserBridgeAccess.loading">
                      <template x-for="bridge in $store.browserBridgeAccess.bridges" :key="bridge.id">
                        <option :value="bridge.id" x-text="bridge.name + (bridge.state === 'revoked' ? ' — revoked' : '')"></option>
                      </template>
                    </select>
                  </label>
                  <p class="browser-config-field-help" x-show="$store.browserBridgeAccess.selectedBridge()?.state === 'revoked'">Access revoked. Pair this browser again to reconnect. Existing tabs are left open.</p>
                  <template x-if="$store.browserBridgeAccess.selectedBridge()?.state === 'active'">
                    <div>
                      <p class="browser-config-field-help" role="status" x-text="$store.browserBridgeSelection.statusText()"></p>
                      <p class="browser-config-field-help" x-show="$store.browserBridgeSelection.contextStatusText()" x-text="$store.browserBridgeSelection.contextStatusText()"></p>
                      <div class="browser-pairing-actions">
                        <button type="button" class="browser-pairing-button"
                          @click="$store.browserBridgeSelection.useBrowser($store.browserBridgeAccess.selectedId)"
                          :disabled="!$store.browserBridgeSelection.canSelect($store.browserBridgeAccess.selectedId)">
                          <x-icon name="desktop_windows"></x-icon>
                          <span x-text="$store.browserBridgeSelection.selectedDefault($store.browserBridgeAccess.selectedId) ? 'Default Chrome browser' : 'Use this Chrome browser'"></span>
                        </button>
                        <button type="button" class="browser-pairing-button" @click="$store.browserBridgeSelection.clear()"
                          x-show="$store.browserBridgeSelection.defaultSelection?.selected"
                          :disabled="$store.browserBridgeSelection.busy || $store.browserBridgeSelection.loading">Use internal browser</button>
                      </div>
                      <p class="browser-config-field-help">Saved permissions do not enable browser control or approve purchases, submissions, or other consequential actions. Chrome permissions are checked separately.</p>
                      <div class="browser-config-switch-row">
                        <span class="browser-config-switch-copy">
                          <span class="browser-config-field-label">All websites</span>
                          <span class="browser-config-field-help">Allow browsing once for this Chrome browser, across chats. Restricted pages and separate action approvals still apply.</span>
                        </span>
                        <button type="button" class="browser-pairing-button"
                          :disabled="!$store.browserBridgeAccess.canManageSites() || $store.browserBridgeAccess.policyState !== 'loaded'"
                          @click="$store.browserBridgeAccess.setAllWebsites($store.browserBridgeAccess.siteMode !== 'allow_all_websites')"
                          x-text="$store.browserBridgeAccess.siteMode === 'allow_all_websites' ? 'Turn off all-websites access' : 'Allow all websites'"></button>
                      </div>
                      <p class="browser-config-field-help" x-show="$store.browserBridgeAccess.policyState === 'loaded' &amp;&amp; $store.browserBridgeAccess.siteMode === 'allow_all_websites'">All supported websites are allowed. Turning this off keeps the individually saved sites below.</p>
                      <form class="browser-site-form" @submit.prevent="$store.browserBridgeAccess.allowSite()">
                        <label class="browser-config-field">
                          <span class="browser-config-field-label">Website address</span>
                          <input type="url" placeholder="https://example.com" maxlength="2048" autocomplete="off" spellcheck="false"
                            aria-describedby="browser-site-origin-help" x-model="$store.browserBridgeAccess.originDraft"
                            :disabled="$store.browserBridgeAccess.busy" />
                          <span id="browser-site-origin-help" class="browser-config-field-help">Enter a website address such as https://example.com, without a page path.</span>
                        </label>
                        <button type="submit" class="browser-pairing-button" :disabled="!$store.browserBridgeAccess.canAllowSite()">Allow site</button>
                      </form>
                      <p class="browser-config-field-help" role="status" x-show="$store.browserBridgeAccess.policyState === 'loading'">Checking saved site permissions…</p>
                      <p class="browser-config-field-help" role="status" x-show="$store.browserBridgeAccess.policyState === 'unavailable'">Site permissions could not be checked. Check connection to retry.</p>
                      <p class="browser-config-field-help" x-show="$store.browserBridgeAccess.policyState === 'loaded' &amp;&amp; $store.browserBridgeAccess.siteMode !== 'allow_all_websites' &amp;&amp; !$store.browserBridgeAccess.grants.length">No sites allowed. Site access is denied unless you grant permission.</p>
                      <ul class="browser-site-grants" aria-label="Allowed sites">
                        <template x-for="grant in $store.browserBridgeAccess.grants" :key="grant.id">
                          <li><span x-text="grant.origin"></span><button type="button" class="browser-pairing-button"
                            :aria-label="'Remove permission for ' + grant.origin" :disabled="$store.browserBridgeAccess.busy"
                            @click="$store.browserBridgeAccess.revokeSite(grant.origin)">Remove</button></li>
                        </template>
                      </ul>
                      <button type="button" class="browser-pairing-button browser-pairing-button-danger"
                        :disabled="!$store.browserBridgeAccess.canManageSites()" @click="$store.browserBridgeAccess.revokeBridge()">
                        <x-icon name="link_off"></x-icon><span>Revoke browser access</span>
                      </button>
                    </div>
                  </template>
                </div>
              </template>
            </section>
          </template>
        </div>

        <details class="browser-config-card browser-advanced-settings">
          <summary class="section-title">Internal browser and advanced host connection</summary>
          <div class="section-description">
            The internal browser needs no Chrome setup. Launcher and A0 CLI host connections use the advanced browser setup below.
          </div>

          <label class="browser-config-field" x-show="!$store.browserConfig.isCompanionSelected()">
            <span class="browser-config-field-label">Browser location</span>
            <select x-model="$store.browserConfig.config.runtime_backend">
              <option value="container">Internal Docker browser</option>
              <option value="host_required">Advanced: Launcher or A0 CLI host browser</option>
            </select>
            <span
              class="browser-config-field-help"
              x-show="$store.browserConfig.config.runtime_backend !== 'host_required'"
            >
              Runs inside Agent Zero's Docker environment. No host connection or browser setup is needed.
            </span>
            <span
              class="browser-config-field-help"
              x-show="$store.browserConfig.config.runtime_backend === 'host_required' &amp;&amp; !$store.browserConfig.isCompanionSelected()"
            >
              Uses Safari, Chrome, Edge, Brave, Opera, Vivaldi, or Chromium on a computer connected through Launcher or A0 CLI. The browser opens when the agent first needs it.
            </span>
            <span class="browser-config-field-help"
              x-show="$store.browserConfig.isDevelopmentBrowserSelected()">
              This old development connection is retired. Pair and select the production Chrome extension above; no access is transferred automatically.
            </span>
          </label>

          <div
            class="browser-config-note browser-config-success"
            x-show="$store.browserConfig.config.runtime_backend !== 'host_required'"
          >
            <x-icon name="deployed_code"></x-icon>
            <span>Internal Docker browser selected. Host-browser connection settings are ignored for Browser tool runs.</span>
          </div>

          <details
            class="browser-config-proxy"
            x-show="$store.browserConfig.config.runtime_backend === 'container'"
          >
            <summary>Proxy server</summary>
            <div class="browser-config-proxy-body">
              <label class="browser-config-field">
                <input
                  type="text"
                  x-model="$store.browserConfig.config.proxy_server"
                  placeholder="http://proxy.example:3128 or socks5://proxy.example:1080"
                  aria-label="Proxy server"
                  autocomplete="off"
                />
                <span class="browser-config-field-help">Optional. Routes the internal browser through this HTTP or SOCKS proxy.</span>
              </label>

              <label class="browser-config-field">
                <span class="browser-config-field-label">Bypass proxy for</span>
                <input
                  type="text"
                  x-model="$store.browserConfig.config.proxy_bypass"
                  placeholder="localhost, .example.com"
                  autocomplete="off"
                />
                <span class="browser-config-field-help">Optional comma-separated domains that should connect directly.</span>
              </label>

              <label class="browser-config-field">
                <span class="browser-config-field-label">Proxy username</span>
                <input
                  type="text"
                  x-model="$store.browserConfig.config.proxy_username"
                  autocomplete="off"
                />
              </label>

              <label class="browser-config-field">
                <span class="browser-config-field-label">Proxy password</span>
                <input
                  type="password"
                  x-model="$store.browserConfig.config.proxy_password"
                  autocomplete="off"
                />
                <span class="browser-config-field-help">Saving proxy changes restarts active internal Browser sessions.</span>
              </label>
            </div>
          </details>

          <label
            class="browser-config-field"
            x-show="$store.browserConfig.config.runtime_backend === 'host_required' &amp;&amp; !$store.browserConfig.isCompanionSelected()"
          >
            <span class="browser-config-field-label">Host browser profile</span>
            <select x-model="$store.browserConfig.config.host_browser_profile_mode">
              <option value="existing">Existing browser profile</option>
              <option value="agent">Clean Agent profile</option>
            </select>
            <span
              class="browser-config-field-help"
              x-show="$store.browserConfig.config.host_browser_profile_mode === 'agent'"
            >
              Uses a separate A0-controlled local profile on this computer.
            </span>
          </label>

          <label
            class="browser-config-field"
            x-show="$store.browserConfig.config.runtime_backend === 'host_required' && !$store.browserConfig.isCompanionSelected() && $store.browserConfig.config.host_browser_profile_mode !== 'agent'"
          >
            <span class="browser-config-field-label">Host browser</span>
            <select
              :value="$store.browserConfig.hostBrowserSelectValue()"
              @focus="$store.browserConfig.loadHostBrowserStatus()"
              @click="$store.browserConfig.loadHostBrowserStatus()"
              @change="$store.browserConfig.setHostBrowserSelection($event.target.value)"
            >
              <template x-for="option in $store.browserConfig.hostBrowserOptions()" :key="option.value">
                <option :value="option.value" x-text="option.label"></option>
              </template>
            </select>
            <span class="browser-config-field-help">Choose an available host browser, or leave Automatic to use the first available one.</span>
          </label>

          <label
            class="browser-config-field"
            x-show="$store.browserConfig.config.runtime_backend === 'host_required' && !$store.browserConfig.isCompanionSelected() && $store.browserConfig.config.host_browser_profile_mode !== 'agent' && $store.browserConfig.showCustomHostBrowserEndpoint()"
          >
            <span class="browser-config-field-label">Custom endpoint</span>
            <input
              type="text"
              :value="$store.browserConfig.hostBrowserCustomEndpoint"
              @focus="$store.browserConfig.loadHostBrowserStatus()"
              @input="$store.browserConfig.setCustomHostBrowserEndpoint($event.target.value)"
              placeholder="ws://127.0.0.1:9222/devtools/browser/..."
              autocomplete="off"
            />
            <span class="browser-config-field-help" x-text="$store.browserConfig.customHostBrowserEndpointDiagnostic()"></span>
          </label>

          <div
            class="browser-config-guide"
            x-show="$store.browserConfig.config.runtime_backend === 'host_required' && !$store.browserConfig.isCompanionSelected() && $store.browserConfig.config.host_browser_profile_mode !== 'agent'"
          >
            <div class="browser-config-guide-heading">
              <x-icon name="tune"></x-icon>
              <span>Browser setup</span>
            </div>

            <div class="browser-config-guide-grid">
              <div class="browser-config-guide-item" aria-label="Chromium browser setup steps">
                <div class="browser-config-guide-title">
                  <x-icon name="developer_mode"></x-icon>
                  <span>Chromium family</span>
                </div>
                <div class="browser-config-setup-buttons" role="group" aria-label="Open Chromium browser setup page">
                  <button
                    type="button"
                    class="browser-config-setup-button"
                    x-show="$store.browserConfig.hostBrowserSetupAvailable('chrome')"
                    title="Open chrome://inspect/#remote-debugging in Chrome"
                    :disabled="!!$store.browserConfig.hostBrowserSetupOpening"
                    @click="$store.browserConfig.openHostBrowserSetup('chrome')"
                  >
                    <span>Chrome</span>
                    <x-icon name="open_in_new"></x-icon>
                  </button>
                  <button
                    type="button"
                    class="browser-config-setup-button"
                    x-show="$store.browserConfig.hostBrowserSetupAvailable('opera')"
                    title="Open opera://inspect/#remote-debugging in Opera"
                    :disabled="!!$store.browserConfig.hostBrowserSetupOpening"
                    @click="$store.browserConfig.openHostBrowserSetup('opera')"
                  >
                    <span>Opera</span>
                    <x-icon name="open_in_new"></x-icon>
                  </button>
                  <button
                    type="button"
                    class="browser-config-setup-button"
                    x-show="$store.browserConfig.hostBrowserSetupAvailable('edge')"
                    title="Open edge://inspect/#remote-debugging in Edge"
                    :disabled="!!$store.browserConfig.hostBrowserSetupOpening"
                    @click="$store.browserConfig.openHostBrowserSetup('edge')"
                  >
                    <span>Edge</span>
                    <x-icon name="open_in_new"></x-icon>
                  </button>
                </div>
                <p>Enable <strong>Allow remote debugging for this browser instance</strong>; reconnect the host connection if needed.</p>
                <p class="browser-config-guide-support">Brave, Vivaldi, and Chromium are supported through their own inspect pages.</p>
              </div>

              <div class="browser-config-guide-item">
                <div class="browser-config-guide-title">
                  <x-icon name="web_asset"></x-icon>
                  <span>Safari <small>macOS</small></span>
                </div>
                <ol aria-label="Safari setup steps">
                  <li>Open <strong>Safari Settings &gt; Advanced</strong> and enable <strong>Show features for web developers</strong>.</li>
                  <li>Open <strong>Developer</strong> and enable <strong>Allow remote automation</strong>.</li>
                </ol>
                <p>Safari uses a dedicated automation window and needs no debug endpoint.</p>
              </div>
            </div>

            <details class="browser-config-guide-details">
              <summary>Manual debug endpoint</summary>
              <p>
                Launch the browser with <code>--remote-debugging-port=9222</code> and
                <code>--user-data-dir=&lt;profile-dir&gt;</code>, then use <code>localhost:9222</code> or the full
                <code>ws://.../devtools/browser/...</code> endpoint in Custom endpoint or
                <code>A0_HOST_BROWSER_REMOTE_DEBUGGING_ENDPOINTS</code>.
              </p>
            </details>
          </div>

          <div
            class="browser-config-warning"
            x-show="$store.browserConfig.config.runtime_backend === 'host_required' && !$store.browserConfig.isCompanionSelected() && $store.browserConfig.config.host_browser_profile_mode !== 'agent'"
          >
            <x-icon name="warning"></x-icon>
            <span>
              Existing profile lets the agent interact with the browser instance you authorize,
              including signed-in sites, cookies, tabs, downloads, and page content.
            </span>
          </div>

          <label
            class="browser-config-field"
            x-show="$store.browserConfig.config.runtime_backend === 'host_required'"
          >
            <span class="browser-config-field-label">Page content access</span>
            <select x-model="$store.browserConfig.config.host_browser_privacy_policy">
              <option value="enforce_local">Local models only</option>
              <option value="warn">Warn when using cloud</option>
              <option value="allow">Allow</option>
            </select>
            <span class="browser-config-field-help">Controls page text and screenshots from the host browser.</span>
          </label>

          <div class="browser-config-note">
            <x-icon :class="{ spinning: $store.browserConfig.hostBrowserStatusLoading }" :name="$store.browserConfig.hostBrowserStatusLoading ? 'progress_activity' : 'captive_portal'"></x-icon>
            <span x-text="$store.browserConfig.browserRuntimeStatusLabel()"></span>
          </div>
        </details>

        <details class="browser-config-card">
          <summary class="section-title">Internal browser preferences</summary>
          <div class="section-description">
            Set how new Browser sessions start and how an already-open Browser surface follows agent activity.
          </div>

          <label class="browser-config-field">
            <span class="browser-config-field-label">Starting page</span>
            <input
              type="text"
              x-model="$store.browserConfig.config.default_homepage"
              placeholder="about:blank or https://example.com"
              autocomplete="off"
            />
          </label>

          <label class="browser-config-field">
            <span class="browser-config-field-label">Browser tabs</span>
            <select
              x-model="$store.browserConfig.config.browser_tab_scope"
              @change="$store.browserConfig.setBrowserTabScope($event.target.value)"
            >
              <option value="per_context">Separate per chat</option>
              <option value="shared">Shared across chats</option>
            </select>
            <span
              class="browser-config-field-help"
              x-show="$store.browserConfig.config.browser_tab_scope !== 'shared'"
            >
              Each chat shows only its own tabs. Browser sign-ins are shared across chats.
            </span>
            <span
              class="browser-config-field-help"
              x-show="$store.browserConfig.config.browser_tab_scope === 'shared'"
            >
              The tab strip shows tabs from every active chat. Browser sign-ins are shared across chats.
            </span>
          </label>

          <label class="browser-config-field">
            <span class="browser-config-field-label">Maximum tabs per chat</span>
            <input
              type="number"
              min="1"
              max="50"
              step="1"
              x-model.number="$store.browserConfig.config.max_open_tabs"
              @change="$store.browserConfig.normalizeMaxOpenTabs()"
            />
            <span class="browser-config-field-help">
              New Browser tabs stop opening in a chat after this limit.
            </span>
          </label>

          <label class="browser-config-field">
            <span class="browser-config-field-label">Keyboard layout</span>
            <input
              type="text"
              x-model="$store.browserConfig.config.keyboard_layout"
              placeholder="de, fr, us, ..."
              autocomplete="off"
            />
            <span class="browser-config-field-help">
              XKB layout of the interactive Browser window, e.g. de for a German keyboard. Match your physical keyboard so characters like @, umlauts, and brackets land on the printed keys. Empty keeps US.
              <a href="https://man.archlinux.org/man/xkeyboard-config.7#LAYOUTS" target="_blank" rel="noreferrer">Full layout list</a>. Changing it restarts the internal browser on save.
            </span>
          </label>

          <label
            class="browser-config-field"
            x-show="$store.browserConfig.config.keyboard_layout"
          >
            <span class="browser-config-field-label">Keyboard variant</span>
            <input
              type="text"
              x-model="$store.browserConfig.config.keyboard_variant"
              placeholder="mac, nodeadkeys, colemak, ..."
              autocomplete="off"
            />
            <span class="browser-config-field-help">
              XKB variant for the layout above. German Mac keyboards use mac, so Option+L types @.
              <a href="https://man.archlinux.org/man/xkeyboard-config.7#LAYOUTS" target="_blank" rel="noreferrer">Variants per layout</a>. Changing it restarts the internal browser on save.
            </span>
          </label>

          <label class="browser-config-switch-row">
            <span class="browser-config-switch-copy">
              <span class="browser-config-field-label">Autofocus active page</span>
              <span class="browser-config-field-help">Follow the active page, including Agent Zero's Chrome tab during browser actions. Turn off to stay in your current tab. Reading pages and background updates never switch Chrome tabs.</span>
            </span>
            <span class="browser-config-toggle-with-label">
              <span class="browser-config-toggle-label" x-text="$store.browserConfig.autofocusLabel()"></span>
              <span class="browser-config-toggle">
                <input
                  type="checkbox"
                  :checked="$store.browserConfig.config.autofocus_active_page !== false"
                  @change="$store.browserConfig.setAutofocusActivePage($event.target.checked)"
                />
                <span class="browser-config-switch"></span>
              </span>
            </span>
          </label>
        </details>

        <details class="browser-config-card">
          <summary class="section-title">Internal browser add-ons</summary>
          <div class="section-description">
            Choose which installed Chrome extensions Browser loads.
          </div>

          <div class="browser-config-warning">
            <x-icon name="warning"></x-icon>
            <span>
              Extensions run inside the Docker browser sandbox, but malicious or buggy extensions can
              still damage that environment. Keep only the extensions you trust enabled.
            </span>
          </div>

          <div class="browser-config-extension-list">
            <div class="browser-config-subtitle">
              <span>Installed extensions</span>
              <x-icon class="spinning" x-show="$store.browserConfig.extensionsLoading" name="progress_activity"></x-icon>
            </div>
            <template x-if="!$store.browserConfig.extensionsLoading && !$store.browserConfig.extensionsList.length">
              <div class="browser-config-empty">No installed extensions found.</div>
            </template>
            <template x-for="extension in $store.browserConfig.extensionsList" :key="extension.path">
              <div class="browser-config-extension-row" :title="extension.path">
                <span class="browser-config-extension-text">
                  <span class="browser-config-extension-name" x-text="extension.name || 'Unnamed extension'"></span>
                  <span class="browser-config-extension-meta" x-text="$store.browserConfig.extensionVersionLabel(extension)"></span>
                </span>
                <span class="browser-config-extension-actions">
                  <label class="browser-config-toggle">
                    <input
                      type="checkbox"
                      :checked="$store.browserConfig.extensionEnabled(extension)"
                      :disabled="$store.browserConfig.extensionDeleteLoadingPath === extension.path"
                      @change="$store.browserConfig.setExtensionEnabled(extension, $event.target.checked)"
                    />
                    <span class="browser-config-switch"></span>
                  </label>
                  <button
                    type="button"
                    class="browser-config-extension-delete"
                    :disabled="!$store.browserConfig.extensionCanDelete(extension) || $store.browserConfig.extensionDeleteLoadingPath === extension.path"
                    :title="$store.browserConfig.extensionDeleteTitle(extension)"
                    :aria-label="'Delete ' + (extension.name || 'extension')"
                    @click.stop="$store.browserConfig.deleteExtension(extension)"
                  >
                    <x-icon
                      :class="{ spinning: $store.browserConfig.extensionDeleteLoadingPath === extension.path }"
                      :name="$store.browserConfig.extensionDeleteLoadingPath === extension.path ? 'progress_activity' : 'delete'"
                    ></x-icon>
                  </button>
                </span>
              </div>
            </template>
            <div class="browser-config-note browser-config-success" x-show="$store.browserConfig.extensionsMessage">
              <x-icon name="check_circle"></x-icon>
              <span x-text="$store.browserConfig.extensionsMessage"></span>
            </div>
            <div class="browser-config-note" x-show="$store.browserConfig.extensionsError">
              <x-icon name="error"></x-icon>
              <span x-text="$store.browserConfig.extensionsError"></span>
            </div>
          </div>

          <div class="browser-config-pill-row">
            <span class="browser-config-pill" x-text="$store.browserConfig.pathCountLabel()"></span>
            <span class="browser-config-pill tone-active" x-show="$store.browserConfig.extensionModeReady()">
              Ready
            </span>
          </div>
        </details>
      </div>
    </template>
  </div>

  <style>
    .browser-config-sections {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .browser-config-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
    }

    .browser-config-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .browser-pairing-card { border: 0; padding: 0; }
    details.browser-config-card { display: block; }
    details.browser-config-card[open] > :not(summary) { margin-top: 14px; }
    .browser-setup-steps > summary,
    details.browser-config-card > summary { cursor: pointer; padding-block: 8px; }
    .browser-setup-steps > summary:focus-visible,
    details.browser-config-card > summary:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }
    .browser-setup-steps > :not(summary) { margin-block: 14px; }
    .browser-setup-list { display: grid; gap: 18px; padding-left: 24px; }
    .browser-setup-list li { padding-left: 4px; line-height: 1.5; }
    .browser-setup-list li > * { margin-top: 8px; }
    .browser-setup-list .browser-pairing-button { max-width: 100%; white-space: normal; text-decoration: none; }

    .browser-config-field-label {
      color: var(--color-text);
      font-size: 0.84rem;
      font-weight: 650;
    }

    .browser-config-field-help {
      color: var(--color-text-secondary);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .browser-config-proxy {
      overflow: hidden;
      border-radius: 8px;
    }

    .browser-config-proxy summary {
      padding: 10px 12px;
      color: var(--color-text);
      font-size: 0.84rem;
      font-weight: 650;
      cursor: pointer;
    }

    .browser-config-proxy-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
      border-top: 1px solid color-mix(in srgb, var(--color-border) 74%, transparent);
    }

    .browser-config-field input[type="text"],
    .browser-config-field input[type="password"],
    .browser-config-field input[type="number"],
    .browser-config-field input[type="url"],
    .browser-config-field select {
      width: 100%;
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, var(--color-border) 74%, transparent);
      border-radius: 8px;
      background: var(--color-input);
      color: var(--color-text);
      font: inherit;
    }

    .browser-config-switch-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      min-height: 46px;
      padding-top: 2px;
    }

    .browser-config-switch-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 3px;
    }

    .browser-config-toggle-with-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .browser-config-toggle-label {
      min-width: 24px;
      color: var(--color-text-secondary);
      font-size: 0.78rem;
      font-weight: 650;
      text-align: right;
    }

    .browser-config-extension-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px solid color-mix(in srgb, var(--color-border) 72%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-panel) 78%, transparent);
    }

    .browser-config-subtitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--color-text-secondary);
      font-size: 0.82rem;
      font-weight: 650;
    }

    .browser-config-subtitle .material-symbols-outlined {
      font-size: 18px;
    }

    .browser-config-empty,
    .browser-config-extension-meta {
      color: var(--color-text-secondary);
      font-size: 0.78rem;
    }

    .browser-config-extension-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 42px;
      padding: 8px 0;
    }

    .browser-config-extension-row + .browser-config-extension-row {
      border-top: 1px solid color-mix(in srgb, var(--color-border) 52%, transparent);
    }

    .browser-config-extension-text {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 2px;
    }

    .browser-config-extension-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--color-text);
      font-weight: 650;
    }

    .browser-config-extension-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .browser-config-toggle {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      width: 42px;
      height: 24px;
    }

    .browser-config-toggle input {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .browser-config-toggle input:disabled {
      cursor: wait;
    }

    .browser-config-switch {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: color-mix(in srgb, var(--color-border) 78%, transparent);
      pointer-events: none;
      transition: background-color 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .browser-config-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-background);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.24);
      transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .browser-config-toggle input:checked + .browser-config-switch {
      background: color-mix(in srgb, var(--color-primary) 76%, #16a34a);
    }

    .browser-config-toggle input:checked + .browser-config-switch::after {
      transform: translateX(18px);
    }

    .browser-config-toggle input:disabled + .browser-config-switch {
      opacity: 0.58;
    }

    .browser-config-extension-delete {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      min-width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border: 1px solid color-mix(in srgb, #be123c 30%, var(--color-border));
      border-radius: 7px;
      background: transparent;
      color: color-mix(in srgb, #be123c 78%, var(--color-text));
      cursor: pointer;
    }

    .browser-config-extension-delete:hover:not(:disabled) {
      background: color-mix(in srgb, #be123c 12%, var(--color-background));
      color: #be123c;
    }

    .browser-config-extension-delete:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .browser-config-extension-delete .material-symbols-outlined {
      font-size: 17px;
    }

    .browser-config-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-panel) 82%, transparent);
      color: var(--color-text-secondary);
      font-size: var(--font-size-small);
    }

    .browser-config-note.browser-config-success {
      background: color-mix(in srgb, #15803d 12%, var(--color-background));
      color: color-mix(in srgb, var(--color-text) 88%, #166534);
    }

    .browser-config-note.browser-config-error {
      background: color-mix(in srgb, #be123c 10%, var(--color-background));
      color: color-mix(in srgb, var(--color-text) 88%, #9f1239);
    }

    .browser-bridge-access {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-border);
    }

    .browser-bridge-access h3 { margin: 0; font-size: 1rem; }
    .browser-site-form { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .browser-site-form > label { flex: 1 1 16rem; min-width: 0; }
    .browser-site-grants { list-style: none; padding: 0; margin: 1rem 0; }
    .browser-site-grants li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; }
    .browser-site-grants li > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .browser-bridge-access input { caret-color: var(--color-primary); }
    .browser-bridge-access ::selection { background: var(--color-primary); color: var(--color-background); }

    .browser-pairing-heading,
    .browser-pairing-code-heading,
    .browser-pairing-server {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .browser-pairing-heading > div {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    .browser-pairing-code-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border: 1px solid color-mix(in srgb, var(--color-primary) 38%, var(--color-border));
      border-radius: 10px;
      background: color-mix(in srgb, var(--color-primary) 7%, var(--color-background));
    }

    .browser-pairing-code-heading {
      color: var(--color-text-secondary);
      font-size: 0.78rem;
      font-weight: 650;
    }

    .browser-pairing-code {
      display: block;
      width: 100%;
      padding: 12px;
      overflow-wrap: anywhere;
      border: 1px solid color-mix(in srgb, var(--color-border) 72%, transparent);
      border-radius: 8px;
      background: var(--color-input);
      color: var(--color-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(0.82rem, 2.2vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.45;
      text-align: center;
      user-select: all;
    }

    .browser-pairing-server {
      color: var(--color-text-secondary);
      font-size: 0.78rem;
    }

    .browser-pairing-server span:last-child {
      overflow-wrap: anywhere;
      color: var(--color-text);
      text-align: right;
    }

    .browser-pairing-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .browser-pairing-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, var(--color-border) 78%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-panel) 88%, var(--color-background));
      color: var(--color-text);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 650;
      cursor: pointer;
    }

    .browser-pairing-button:hover:not(:disabled) {
      border-color: color-mix(in srgb, var(--color-primary) 48%, var(--color-border));
      background: color-mix(in srgb, var(--color-primary) 10%, var(--color-background));
    }

    .browser-pairing-button:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .browser-pairing-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .browser-pairing-button-primary {
      border-color: color-mix(in srgb, var(--color-primary) 55%, var(--color-border));
      background: var(--color-primary);
      color: var(--color-primary-text, #fff);
    }

    .browser-pairing-button-primary:hover:not(:disabled) {
      background: color-mix(in srgb, var(--color-primary) 86%, #000);
    }

    .browser-pairing-button-danger {
      color: color-mix(in srgb, #be123c 78%, var(--color-text));
    }

    .browser-pairing-button .material-symbols-outlined {
      font-size: 18px;
    }

    .browser-config-guide {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .browser-config-guide-heading,
    .browser-config-guide-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--color-text);
      font-size: 0.84rem;
      font-weight: 650;
    }

    .browser-config-guide-heading .material-symbols-outlined,
    .browser-config-guide-title .material-symbols-outlined {
      color: var(--color-primary);
      font-size: 19px;
    }

    .browser-config-guide-title small {
      margin-left: 4px;
      color: var(--color-text-secondary);
      font-size: 0.68rem;
      font-weight: 550;
    }

    .browser-config-guide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
    }

    .browser-config-guide-item {
      padding: 11px;
      border: 1px solid color-mix(in srgb, var(--color-border) 72%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-background) 82%, transparent);
    }

    .browser-config-guide-item ol {
      margin: 9px 0 0;
      padding-left: 1.2rem;
      color: var(--color-text-secondary);
      font-size: var(--font-size-small);
      line-height: 1.45;
    }

    .browser-config-guide-item li + li {
      margin-top: 5px;
    }

    .browser-config-guide-item p,
    .browser-config-guide-details p {
      margin: 8px 0 0;
      color: var(--color-text-secondary);
      font-size: var(--font-size-small);
      line-height: 1.4;
    }

    .browser-config-setup-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .browser-config-setup-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid color-mix(in srgb, var(--color-primary) 36%, var(--color-border));
      border-radius: 7px;
      background: color-mix(in srgb, var(--color-primary) 7%, var(--color-panel));
      color: var(--color-text);
      font: inherit;
      font-size: var(--font-size-small);
      font-weight: 650;
      cursor: pointer;
    }

    .browser-config-setup-button:hover:not(:disabled) {
      border-color: color-mix(in srgb, var(--color-primary) 72%, var(--color-border));
      background: color-mix(in srgb, var(--color-primary) 13%, var(--color-panel));
    }

    .browser-config-setup-button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--color-primary) 72%, transparent);
      outline-offset: 2px;
    }

    .browser-config-setup-button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    .browser-config-setup-button .material-symbols-outlined {
      color: var(--color-primary);
      font-size: 15px;
    }

    .browser-config-guide-item .browser-config-guide-support {
      color: color-mix(in srgb, var(--color-text-secondary) 88%, var(--color-primary));
    }

    .browser-config-guide-details {
      border-top: 1px solid color-mix(in srgb, var(--color-border) 64%, transparent);
    }

    .browser-config-guide-details summary {
      padding-top: 10px;
      color: var(--color-text-secondary);
      font-size: var(--font-size-small);
      font-weight: 650;
      cursor: pointer;
    }

    .browser-config-guide-details code {
      color: var(--color-text);
    }

    .browser-config-warning {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 11px 12px;
      border: 1px solid color-mix(in srgb, #d97706 44%, var(--color-border));
      border-radius: 8px;
      background: color-mix(in srgb, #d97706 14%, var(--color-background));
      color: color-mix(in srgb, var(--color-text) 86%, #92400e);
      font-size: var(--font-size-small);
      line-height: 1.4;
    }

    .browser-config-warning .material-symbols-outlined {
      color: #b45309;
      font-size: 20px;
    }

    .browser-config-sections .spinning {
      display: inline-block;
      transform-origin: center;
      animation: browser-config-spin 0.8s linear infinite;
    }

    @keyframes browser-config-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .browser-config-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .browser-config-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
      background: color-mix(in srgb, var(--color-panel) 88%, transparent);
      font-size: 0.78rem;
      color: var(--color-text-secondary);
    }

    .browser-config-pill.tone-active {
      color: #1b5e20;
      border-color: rgba(27, 94, 32, 0.18);
      background: rgba(46, 125, 50, 0.12);
    }

    @media (max-width: 520px) {
      .browser-pairing-heading,
      .browser-pairing-code-heading,
      .browser-pairing-server {
        align-items: flex-start;
        flex-direction: column;
      }

      .browser-pairing-server span:last-child {
        text-align: left;
      }

      .browser-pairing-button {
        flex: 1 1 100%;
      }

      .browser-bridge-access .browser-pairing-button {
        min-height: 44px;
      }

      .browser-site-grants li {
        align-items: stretch;
        flex-direction: column;
      }

      .browser-site-grants .browser-pairing-button {
        flex: 0 0 auto;
        width: 100%;
      }
    }
  </style>
</body>
</html>
