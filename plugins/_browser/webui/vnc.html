<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser viewer</title>
  <style>
    html, body, #screen { width:100%; height:100%; margin:0; overflow:hidden; background:#fff; }
    #status { position:absolute; inset:0; display:grid; place-content:center; font:14px system-ui; background:#fff; }
    #status[hidden] { display:none; }
  </style>
</head>
<body>
  <div id="screen" aria-label="Interactive browser"></div>
  <div id="status" role="status">Connecting to browser…</div>
  <script type="module" src="./vnc.js"></script>
</body>
</html>
