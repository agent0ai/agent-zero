retention_enabled: true
retention_sweep_interval_hours: 6
retention_max_age_days: 0 # 0 = disable whole-history deletion for inactive workspaces
retention_orphan_grace_hours: 24
retention_stale_lock_minutes: 30
capture_exclude_patterns: ""
capture_max_file_mb: 0 # 0 = no file-size limit
history_retention_enabled: true # Expire older recovery points during scheduled cleanup
history_max_snapshots: 500 # Recent snapshots, plus current state and boundary checkpoints; 0 disables this limit
history_max_age_days: 30 # 0 disables age-based expiry
