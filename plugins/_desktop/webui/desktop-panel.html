<html>
<head><script type="module">import { store } from "/plugins/_desktop/webui/desktop-store.js";</script></head>
<body>
  <div x-data class="desktop-root">
    <template x-if="$store.desktop">
      <div class="desktop-panel surface-workspace" x-create="$store.desktop.onMount($el, xAttrs($el) || {})" x-destroy="$store.desktop.cleanup($el)">
        <div role="status" x-show="$store.desktop.loading">Starting Desktop…</div>
        <button type="button" class="btn btn-field" x-show="!$store.desktop.ready && !$store.desktop.loading" @click="$store.desktop.onOpen()">Open Desktop</button>
        <div data-tuxee-host></div>
      </div>
    </template>
  </div>
  <style>
    .desktop-root, .desktop-panel { display:flex; flex-direction:column; flex:1; height:100%; width:100%; min-height:0; min-width:0; background:var(--surface-background); }
    .desktop-panel [data-tuxee-host] { flex:1; min-height:0; min-width:0; }
    .modal-inner.desktop-modal {
      width:min(1040px, calc(100vw - 32px)); height:min(760px, calc(100vh - 32px));
      min-width:min(480px, calc(100vw - 16px)); min-height:min(460px, calc(100vh - 16px));
      max-width:none; max-height:none; overflow:hidden;
    }
    .modal-inner.desktop-modal .modal-scroll,
    .modal-inner.desktop-modal .desktop-modal-body,
    .modal-inner.desktop-modal .desktop-modal-body > x-component {
      display:flex; flex:1; min-width:0; min-height:0; width:100%; height:100%; padding:0; overflow:hidden;
    }
  </style>
</body>
</html>
