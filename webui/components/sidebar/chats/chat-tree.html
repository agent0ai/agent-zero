<html>
<head></head>
<body>
  <div x-data class="sidebar-row-content">
    <div :class="{'chat-container': true, 'chat-child-container': !!context.parent_context_id, 'chat-has-children': $store.chats.hasChildren(context.id), 'chat-selected': context.id === $store.chats.selected}"
      @click="$store.chats.selectChat(context.id)">
      <button class="chat-expand-btn"
              x-show="$store.chats.hasChildren(context.id)"
              :class="{ 'is-visible': $store.chats.hasChildren(context.id), 'is-expanded': $store.chats.isExpanded(context.id) }"
              :aria-expanded="$store.chats.isExpanded(context.id)"
              :aria-label="$store.chats.isExpanded(context.id) ? 'Collapse chat children' : 'Expand chat children'"
              @click.stop="$store.chats.toggleChildren(context.id)">
        <x-icon
          :name="$store.chats.isExpanded(context.id) ? 'keyboard_arrow_down' : 'keyboard_arrow_right'"></x-icon>
      </button>
      <div class="chat-list-button">
        <span :class="{'project-color-ball': true, 'heartbeat': context.running}"
          :style="context.project?.color ? { backgroundColor: context.project.color } : { border: '1px solid var(--color-border)' }"></span>
        <span class="chat-name"
          x-text="$store.chats.displayName(context)"></span>
      </div>
      <button class="btn-icon-action chat-list-action-btn" title="Close chat" @click.stop="$confirmClick($event, () => $store.chats.killChat(context.id))">
        <x-icon name="close"></x-icon>
      </button>
      <button type="button" class="btn-icon-action chat-list-action-btn"
        aria-label="More chat actions" aria-haspopup="menu"
        :aria-expanded="($store.sidebar.rowMenuOpenId === `chat:${context.id}`).toString()"
        @click.stop="$store.sidebar.rowMenuToggle(`chat:${context.id}`, 'chat', $event.currentTarget)">
        <x-icon name="more_vert"></x-icon>
      </button>
    </div>
    <template x-if="$store.chats.isExpanded(context.id) && $store.chats.hasChildren(context.id)">
    <ul class="chat-child-list">
      <template x-for="(child, childIndex) in $store.chats.childContexts(context.id)" :key="child.id">
        <li :class="{ 'sidebar-list-divider': $store.sidebar.hasRowDividerBefore('chat', child, childIndex, $store.chats.childContexts(context.id)) }">
          <div x-data="{ get context() { return child; } }">
            <x-component path="sidebar/chats/chat-tree.html"></x-component>
          </div>
        </li>
      </template>
    </ul>
    </template>
  </div>
</body>
</html>
