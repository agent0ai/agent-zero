<html
  class="surface-modal file-browser-modal modal-no-backdrop"
  data-surface-id="files"
  data-surface-modal-path="modals/file-browser/file-browser.html"
  data-surface-dock-title="Open Files in canvas"
  data-surface-dock-icon="dock_to_right"
  data-canvas-surface="files"
  data-canvas-modal-path="modals/file-browser/file-browser.html"
  data-canvas-dock-title="Open Files in canvas"
  data-canvas-dock-icon="dock_to_right"
>
  <head>
    <title>File Browser</title>
    <script type="module">
      import { store } from "/components/modals/file-browser/file-browser-store.js";
    </script>
  </head>
  <body class="file-browser-modal-body">
    <div
      x-data="{
        owner: xAttrs($el)?.owner || 'fileBrowser', mounted: null,
        get fb() { return this.owner === 'fileBrowser' ? $store.fileBrowser.current : $store[this.owner]; },
        mount() {
          const next = this.fb;
          if (this.mounted?.viewName === next?.viewName) return;
          this.mounted?.onUnmount(this.$el);
          this.mounted = next;
          next?.onMount(this.$el, xAttrs(this.$el) || {});
        }
      }"
      class="file-browser-shell surface-workspace"
      data-internal-dropzone
      :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas', 'is-embedded': xAttrs($el)?.mode === 'embedded' }"
      x-effect="mount()"
      x-destroy="mounted?.onUnmount($el)"
    >
      <template x-if="fb">
        <div
          class="file-browser-root"
          x-data="{
            pathRoot: $el, menu: '', menuStyle: {}, menuTrigger: null, crumbsOverflow: 0,
            dialogKind: '', dialogEntries: [], trashEntries: [], trashIds: [], archiveName: '', dialogError: '', purgeConfirm: false, trashLoading: false,
            properties: null, permissionMode: '', measuring: false, dialogRequest: 0,
            async loadProperties() {
              const request = ++this.dialogRequest;
              this.properties = null; this.permissionMode = ''; this.measuring = false;
              try {
                const entries = fb.isRemote() ? this.dialogEntries : (await fb.propertyData('properties', this.dialogEntries)).entries;
                if (request !== this.dialogRequest) return;
                this.properties = fb.summarizeProperties(entries);
                this.permissionMode = this.properties.mode === 'Multiple' ? '' : this.properties.mode || '';
              } catch (error) { if (request === this.dialogRequest) this.dialogError = error.message; }
            },
            async measureProperties() {
              const request = this.dialogRequest;
              this.measuring = true; this.dialogError = '';
              try {
                const result = await fb.propertyData('size', this.dialogEntries);
                if (request === this.dialogRequest) this.properties.size = result.size;
              } catch (error) { if (request === this.dialogRequest) this.dialogError = error.message; }
              finally { if (request === this.dialogRequest) this.measuring = false; }
            },
            async applyPermissions() {
              const paths = this.dialogEntries.map(entry => fb.normalizePath(entry.path));
              if (await fb.localAction('chmod', paths, {mode: this.permissionMode})) this.$refs.details.close();
              else { await this.loadProperties(); this.dialogError = fb.operationError; }
            },
            async refreshTrash() {
              this.trashLoading = true;
              try { this.trashEntries = await fb.readTrash(); this.trashIds = []; }
              catch (error) { this.dialogError = error.message; }
              finally { this.trashLoading = false; }
            },
            async showDialog(kind) {
              this.closeMenu(); fb.closeDropdown();
              this.dialogKind = kind; this.dialogError = ''; this.purgeConfirm = false;
              this.dialogEntries = fb.selectedFiles.length ? [...fb.selectedFiles] : [{path: fb.browser.currentPath, is_dir: true}];
              this.archiveName = (this.dialogEntries.length === 1 ? this.dialogEntries[0].name : 'Selection') + '.zip';
              this.$refs.details.showModal();
              if (kind === 'Trash') await this.refreshTrash();
              if (kind === 'Properties') await this.loadProperties();
            },
            async changeTrash(action) {
              this.dialogError = '';
              if (!await fb.localAction(action, this.trashIds)) this.dialogError = fb.operationError;
              this.purgeConfirm = false; await this.refreshTrash();
            },
            backgroundMenu(event) {
              if (fb.isPickerMode() || event.target.closest('.file-item, .file-header, button')) return;
              event.preventDefault(); fb.clearSelection(); fb.closeDropdown();
              this.menuTrigger = this.$refs.list;
              this.menuStyle = fb.getDropdownStyle({getBoundingClientRect: () => ({left:event.clientX, right:event.clientX, top:event.clientY, bottom:event.clientY})}, 190, false);
              this.menu = 'background';
              this.$nextTick(() => this.$refs.backgroundMenu.querySelector('button:not([disabled])')?.focus());
            },
            closeMenu(restoreFocus = false) { this.menu = ''; this.menuStyle = {}; if (restoreFocus) this.menuTrigger?.focus(); },
            toggleMenu(name, trigger, width) {
              const opening = this.menu !== name;
              this.closeMenu();
              fb.closeDropdown();
              if (opening) {
                this.menuTrigger = trigger; this.menuStyle = fb.getDropdownStyle(trigger, width); this.menu = name;
                $nextTick(() => Array.from($refs[name + 'Menu']?.querySelectorAll('button') || []).find(button => button.checkVisibility())?.focus({preventScroll: true}));
              }
            }
          }"
          x-create="void ($el._endGestures = fb.mountGestures($el, () => fb))"
          x-destroy="$el._endGestures?.()"
          x-effect="fb.fileTree.follow(fb.browser.currentPath); fb.isLoading; closeMenu()"
          @resize.window="closeMenu(); fb.clearPathSuggestions()"
          @scroll.window.capture="if (!$event.target.closest?.('.path-navigator, .path-suggestions, .path-overflow-menu')) { closeMenu(); fb.clearPathSuggestions(); }"
          @keydown.escape.window.capture="if (menu) { $event.stopPropagation(); closeMenu(true); }"
          :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas', 'is-embedded': fb.embedded }"
        >
          <!-- File Browser Content -->
          <div class="file-browser-content">
            <!-- Path navigator -->
            <div class="path-navigator-wrap">
              <form class="path-navigator surface-toolbar" @submit.prevent="fb.submitPath()">
                <button
                  type="button"
                  class="file-browser-header-button surface-control nav-history-button"
                  @click="fb.navigateBack()"
                  :disabled="!fb.history.length || fb.isLoading"
                  aria-label="Go back"
                  title="Go back"
                >
                  <x-icon aria-hidden="true" name="arrow_back"></x-icon>
                </button>
                <button
                  type="button"
                  class="file-browser-header-button surface-control nav-history-button"
                  @click="fb.navigateForward()"
                  :disabled="!fb.forwardHistory.length || fb.isLoading"
                  aria-label="Go forward"
                  title="Go forward"
                >
                  <x-icon aria-hidden="true" name="arrow_forward"></x-icon>
                </button>
                <template x-if="fb.preferences.pathBar === 'raw' || fb.pathEditing">
                  <div class="path-edit-group">
                    <div class="path-input-shell" :class="{ 'has-error': fb.pathError }" @mousedown.self.prevent @click.self="fb.focusPathInput($el)">
                      <input
                        class="path-input"
                        type="text"
                        x-model="fb.pathInput"
                        x-create="fb.pinPathInput($el); if (fb.pathEditing) $nextTick(() => { if ($el.checkVisibility({checkOpacity: true})) $el.focus(); })"
                        x-effect="fb.pathInput; fb.scrollPathInputNextFrame($el)"
                        x-destroy="$el._pinResizeObserver?.disconnect()"
                        @input="fb.queuePathSuggestions($el)"
                        @focus="fb.showPathSuggestions($el)"
                        @blur="fb.hidePathSuggestions(); fb.pinPathInputAfterBlur($el)"
                        @keydown.arrow-down="if (fb.movePathSuggestion(1)) $event.preventDefault()"
                        @keydown.arrow-up="if (fb.movePathSuggestion(-1)) $event.preventDefault()"
                        @keydown.tab="if (!$event.shiftKey && fb.selectPathSuggestion($el)) { $event.preventDefault(); $el.focus(); }"
                        @keydown.escape.stop.prevent="fb.exitPathEdit(true)"
                        :aria-invalid="fb.pathError ? 'true' : 'false'"
                        aria-label="Directory path"
                        spellcheck="false"
                        autocomplete="off"
                      />
                      <button
                        :type="fb.pathEditing ? 'submit' : 'button'"
                        class="file-browser-header-button path-submit"
                        @mousedown.prevent
                        @click="if (!fb.pathEditing) fb.focusPathInput($el)"
                        :class="{ 'is-submitting': fb.isPathSubmitting || fb.isLoading }"
                        :disabled="fb.isPathSubmitting || fb.isLoading"
                        :title="fb.pathEditing ? 'Go to directory' : 'Edit directory path'"
                        :aria-label="fb.pathEditing ? 'Go to directory' : 'Edit directory path'"
                      >
                      </button>
                    </div>
                  </div>
                </template>
                <template x-if="fb.preferences.pathBar !== 'raw' && !fb.pathEditing">
                  <div class="path-buttons-group" @click.self="fb.startPathEdit()">
                    <button
                      type="button"
                      class="path-overflow-up"
                      :class="{ 'is-hidden': !crumbsOverflow }"
                      @click="toggleMenu('ancestors', $el, 220)"
                      :disabled="!fb.browser.parentPath || fb.isLoading"
                      :aria-expanded="menu === 'ancestors' ? 'true' : 'false'"
                      aria-label="Parent folders"
                      title="Parent folders"
                    >
                      <x-icon aria-hidden="true" name="chevron_left"></x-icon>
                    </button>
                    <template x-teleport="body">
                      <div
                        class="path-overflow-menu"
                        x-ref="ancestorsMenu"
                        x-show="menu === 'ancestors'"
                        :style="menuStyle"
                        @click.outside="closeMenu()"
                      >
                        <template x-for="ancestor in fb.pathCrumbs().slice(0, crumbsOverflow)" :key="ancestor.path">
                          <button type="button" class="path-ancestor dropdown-item" @click="closeMenu(); fb.navigateToFolder(ancestor.path)">
                            <x-icon aria-hidden="true" name="folder"></x-icon><span x-text="ancestor.name"></span>
                          </button>
                        </template>
                      </div>
                    </template>
                    <div
                      class="path-crumbs"
                      role="navigation"
                      aria-label="Directory path"
                      x-data="{ measure() { requestAnimationFrame(() => { crumbsOverflow = fb.measurePathCrumbFit($el, crumbsOverflow); }); } }"
                      x-create="$el._crumbFitObserver = new ResizeObserver(() => measure()); $el._crumbFitObserver.observe($el)"
                      x-destroy="$el._crumbFitObserver.disconnect()"
                      x-effect="fb.pathCrumbs(); measure()"
                      @click.self="fb.startPathEdit()"
                    >
                      <template x-for="(crumb, index) in fb.pathCrumbs()" :key="crumb.path">
                        <button
                          type="button"
                          class="path-crumb"
                          :class="{ 'is-active': index === fb.pathCrumbs().length - 1 }"
                          @click="fb.navigateToFolder(crumb.path)"
                          :data-file-drop="crumb.path"
                          :disabled="fb.isLoading"
                        >
                          <span class="path-crumb-name" x-text="crumb.name"></span
                          ><span class="path-crumb-separator" aria-hidden="true" x-show="index < fb.pathCrumbs().length - 1">›</span>
                        </button>
                      </template>
                    </div>
                    <button type="button" class="path-edit-toggle" :class="{ 'is-loading': fb.isLoading }"
                      :disabled="fb.isLoading" title="Edit directory path" aria-label="Edit directory path" @click="fb.startPathEdit()">
                    </button>
                  </div>
                </template>
                <template x-teleport="body">
                  <div
                    class="path-suggestions"
                    x-show="fb.pathSuggestions.length && fb.pathSuggestionsOwner?.closest('.file-browser-root') === pathRoot && !fb.pathError"
                    :style="fb.pathSuggestionsStyle"
                    x-effect="$el._fileBrowserOwner = fb.viewName"
                  >
                    <template x-for="(suggestion, index) in fb.pathSuggestions" :key="suggestion.path">
                      <button
                        type="button"
                        class="path-suggestion dropdown-item"
                        :class="{ 'is-active': index === fb.pathSuggestionIndex }"
                        @mousedown.prevent
                        @click="fb.pickPathSuggestion(suggestion)"
                        @mouseenter="fb.pathSuggestionIndex = index"
                      >
                        <x-icon aria-hidden="true" name="folder"></x-icon><span x-text="suggestion.name"></span>
                      </button>
                    </template>
                  </div>
                </template>
              </form>
              <template x-if="fb.pathError">
                <div class="path-error" x-text="fb.pathError"></div>
              </template>
            </div>
            <div class="file-commandbar surface-toolbar" role="toolbar" aria-label="File actions" x-overflow>
              <button type="button" class="surface-control" title="Parent folder" aria-label="Parent folder"
                @click="fb.navigateUp()" :disabled="!fb.browser.parentPath || fb.isLoading"
                :data-file-drop="fb.browser.parentPath"><x-icon name="arrow_upward"></x-icon></button>
              <button type="button" class="surface-control" title="Home folder" aria-label="Home folder"
                @click="fb.navigateToFolder('$WORK_DIR')" :disabled="fb.isLoading"><x-icon name="home"></x-icon></button>
              <button type="button" class="surface-control" title="Trash" aria-label="Open Trash" :hidden="fb.isPickerMode() || fb.isRemote()" @click="showDialog('Trash')"><x-icon name="restore_from_trash"></x-icon></button>
              <button type="button" class="surface-control" title="Refresh files" aria-label="Refresh files"
                @click="fb.fetchFiles(fb.browser.currentPath, { preserveOnError: true })" :disabled="fb.isLoading || fb.isBulkBusy"><x-icon name="refresh"></x-icon></button>
              <button type="button" class="surface-control" title="New folder" aria-label="New folder"
                @click="fb.beginNewFolder()" :hidden="fb.isTextOpenPicker() || !fb.remoteAllowed('upload')"><x-icon name="create_new_folder"></x-icon></button>
              <button type="button" class="surface-control" title="New file" aria-label="New file"
                @click="fb.openNewFile()" :hidden="fb.isPickerMode() || !fb.remoteAllowed('upload') || !fb.remoteAllowed('edit')"><x-icon name="note_add"></x-icon></button>
              <button type="button" class="surface-control" title="Upload files" aria-label="Upload files"
                @click="$refs.upload.click()" :hidden="fb.isPickerMode() || !fb.remoteAllowed('upload')"><x-icon name="upload"></x-icon></button>
              <button type="button" class="surface-control" title="Download selected" aria-label="Download selected"
                @click="fb.bulkDownloadFiles()" :hidden="fb.isPickerMode()" :disabled="!fb.selectionAllows('download')"><x-icon name="download"></x-icon></button>
              <button type="button" class="surface-control" title="Cut" aria-label="Cut" @click="fb.copySelection(true)"
                :hidden="fb.isPickerMode()" :disabled="!fb.selectionAllows('rename')"><x-icon name="content_cut"></x-icon></button>
              <button type="button" class="surface-control" title="Copy" aria-label="Copy" @click="fb.copySelection(false)"
                :hidden="fb.isPickerMode()" :disabled="!fb.selectionAllows('download') || fb.isRemote()"><x-icon name="content_copy"></x-icon></button>
              <button type="button" class="surface-control" title="Paste" aria-label="Paste" @click="fb.pasteSelection()"
                :hidden="fb.isPickerMode()" :disabled="fb.isBulkBusy || !(fb.remoteAllowed('upload') || fb.remoteAllowed('rename'))"><x-icon name="content_paste"></x-icon></button>
              <button type="button" class="surface-control" :title="fb.isRemote() ? 'Delete permanently' : 'Move to Trash'" :aria-label="fb.isRemote() ? 'Delete permanently' : 'Move to Trash'"
                @click="fb.isRemote() ? showDialog('Delete permanently') : fb.trashSelected()" :hidden="fb.isPickerMode()" :disabled="!fb.selectionAllows('delete')"><x-icon name="delete"></x-icon></button>
              <button type="button" class="surface-control" title="Toggle file tree" aria-label="Toggle file tree"
                @click="fb.fileTree.toggle(fb.browser.currentPath)" :aria-pressed="fb.fileTree.shown"><x-icon name="account_tree"></x-icon></button>
              <button type="button" class="surface-control" title="Icon view" aria-label="Icon view" :aria-pressed="fb.preferences.view === 'icons'"
                @click="fb.preferences.view = fb.preferences.view === 'icons' ? 'list' : 'icons'; fb.savePreferences()"><x-icon name="grid_view"></x-icon></button>
              <button type="button" class="surface-control" title="Properties" aria-label="Properties" :hidden="fb.isPickerMode()" @click="showDialog('Properties')"><x-icon name="info"></x-icon></button>
              <button type="button" class="surface-control" title="File Browser Settings" aria-label="File Browser Settings"
                @click="fb.openSettings()" :hidden="fb.isPickerMode()"><x-icon name="settings"></x-icon></button>
            </div>
            <input x-ref="upload" type="file" multiple hidden @change="fb.handleFileUpload($event)">
            <div class="file-browser-workspace">
              <div class="file-browser-list-pane">
                <!-- Files list -->
                <div
                  class="files-list" x-ref="list" role="grid" aria-label="Files" aria-multiselectable="true" tabindex="0"
                  @keydown="fb.listKey($event)"
                  @copy="fb.copySelection(false, $event)" @cut="fb.copySelection(true, $event)"
                  @paste="fb.pasteSelection($event)"
                  @click="if ($event.target === $el || $event.target.closest('.no-files')) fb.clearSelection()"
                  @contextmenu="backgroundMenu($event)"
                  @pointercancel="fb.lastTap = null"
                  :inert="fb.isLoading || fb.isRenaming || fb.isBulkBusy"
                  :class="{ 'file-icons-view': fb.preferences.view === 'icons', 'is-loading': fb.isLoading }"
                  @scroll="fb.lastTap = null; fb.closeDropdown(); closeMenu()"
                >
                  <div class="file-header" role="row">
                    <div class="file-cell-select" role="columnheader">
                      <input
                        type="checkbox"
                        x-show="!fb.isSaveAsPicker()"
                        :checked="fb.allVisibleSelected"
                        :indeterminate="fb.someVisibleSelected && !fb.allVisibleSelected"
                        @change="fb.toggleSelectAllVisible()"
                        :disabled="fb.selectableEntries.length === 0"
                        title="Select visible items"
                        aria-label="Select visible items"
                      />
                    </div>
                    <div class="file-cell" role="columnheader" :aria-sort="fb.browser.sortBy === 'name' ? (fb.browser.sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'">
                      <button type="button" @click="fb.toggleSort('name')">
                      Name
                      <span
                        x-show="fb.browser.sortBy === 'name'"
                        x-text="fb.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                      </button>
                    </div>
                    <div class="file-cell-size" role="columnheader" :aria-sort="fb.browser.sortBy === 'size' ? (fb.browser.sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'">
                      <button type="button" @click="fb.toggleSort('size')">
                      Size
                      <span
                        x-show="fb.browser.sortBy === 'size'"
                        x-text="fb.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                      </button>
                    </div>
                    <div class="file-cell-date" role="columnheader" :aria-sort="fb.browser.sortBy === 'date' ? (fb.browser.sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'">
                      <button type="button" @click="fb.toggleSort('date')">
                      Modified
                      <span
                        x-show="fb.browser.sortBy === 'date'"
                        x-text="fb.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                      </button>
                    </div>
                    <div class="file-cell-actions"></div>
                  </div>

                  <!-- File list entries -->
                  <template x-if="fb.visibleEntries.length">
                    <template x-for="file in fb.visibleEntries" :key="file.path">
                      <div
                        class="file-item" role="row" tabindex="-1"
                        :data-file-path="file.path"
                        :aria-selected="file.selected.toString()"
                        @focus="fb.focusedPath = file.path"
                        @click="fb.clickEntry(file, $event)"
                        @contextmenu="fb.contextEntry(file, $event)"
                        :data-is-dir="file.is_dir"
                        :data-file-drop="file.is_dir ? file.path : null"
                        :class="{
                          'selected': file.selected,
                          'is-cut': fb.clipboard?.move && fb.clipboard.paths.includes(fb.normalizePath(file.path))
                        }"
                      >
                        <label class="file-select-cell" role="gridcell" @click.stop @pointerdown="fb.lastTap = null">
                          <template x-if="fb.isSelectableEntry(file)">
                            <input
                              type="checkbox"
                              tabindex="-1"
                              :checked="file.selected"
                              @click.stop="fb.selectEntry(file, {ctrlKey: true, shiftKey: $event.shiftKey})"
                              :disabled="!fb.isSelectableEntry(file)"
                              :aria-label="`Select ${file.name}`"
                            />
                          </template>
                        </label>
                        <div class="file-name" role="gridcell">
                          <template x-if="file.is_dir">
                            <x-icon name="folder" class="file-icon file-folder-icon"></x-icon>
                          </template>
                          <template x-if="!file.is_dir">
                            <img
                              :src="'/public/' + (file.type === 'unknown' ? 'file' : (fb.isArchive(file.name) ? 'archive' : file.type)) + '.svg'"
                              class="file-icon"
                              :alt="file.type"
                              draggable="false"
                            />
                          </template>
                          <span dir="auto" x-text="file.name"></span>
                        </div>
                        <div class="file-size" role="gridcell" :title="file.is_dir ? null : file.size.toLocaleString() + ' bytes'" x-text="file.is_dir ? '—' : fb.formatFileSize(file.size)"></div>
                        <div class="file-date" role="gridcell" x-text="fb.formatDate(file.modified)"></div>
                        <div class="file-actions" role="gridcell" x-data="{ fileActions: $el }" x-show="!fb.isPickerMode()" @click.stop>
                          <!-- Secondary single-item actions (Rename/...) are grouped under a dropdown -->
                          <div
                            class="dropdown file-actions-dropdown"
                          >
                            <button
                              type="button"
                              class="btn-icon-action dropdown-trigger"
                              @click.stop="fb.toggleDropdown(file.path, $event.currentTarget)"
                              :aria-expanded="fb.isDropdownOpen(file.path, fileActions).toString()"
                              :aria-label="`Actions for ${file.name}`"
                              title="More actions"
                            >
                              <x-icon name="more_vert"></x-icon>
                            </button>

                            <template x-if="fb.isDropdownOpen(file.path, fileActions)">
                            <div><template x-teleport="body">
                              <div
                                class="dropdown-menu file-actions-menu"
                                @click.outside="if (!$event.target.closest('.dropdown-trigger')) fb.closeDropdown()"
                                x-init="$nextTick(() => Array.from($el.querySelectorAll('button')).find(b => b.checkVisibility())?.focus({preventScroll:true}))"
                                @keydown.escape.stop.prevent="fb.closeDropdown(true)"
                                @keydown.arrow-down.stop.prevent="fb.focusMenuButton($el, 1)"
                                @keydown.arrow-up.stop.prevent="fb.focusMenuButton($el, -1)"
                                :style="fb.dropdownStyle"
                                @click.stop="fb.closeDropdown()"
                              >
                                <button type="button" class="dropdown-item" x-show="fb.selectedCount === 1 &amp;&amp; fb.canPreview(file)" @click="fb.previewFile(file)">
                                  <x-icon name="visibility"></x-icon><span>Preview</span></button>
                                <button type="button" class="dropdown-item" x-show="fb.selectedCount === 1 &amp;&amp; fb.isEditableFile(file)" @click="fb.openFileEditor(file)">
                                  <x-icon name="edit"></x-icon><span>Edit</span></button>
                                <button type="button" class="dropdown-item" x-show="fb.selectedCount === 1 &amp;&amp; fb.canOpenInActionMenu(file)" @click="fb.openInSurface(file)">
                                  <x-icon :name="fb.surfaceActionIcon(file)"></x-icon><span x-text="fb.surfaceActionLabel(file)"></span></button>
                                <button type="button" class="dropdown-item" x-show="fb.selectedCount === 1 &amp;&amp; fb.selectionAllows('rename')" @click="fb.beginRename(file)">
                                  <x-icon name="drive_file_rename_outline"></x-icon><span>Rename</span></button>
                                <button type="button" class="dropdown-item" :disabled="!fb.selectionAllows('rename')" @click="fb.copySelection(true)">
                                  <x-icon name="content_cut"></x-icon><span>Cut</span></button>
                                <button type="button" class="dropdown-item" :disabled="!fb.selectionAllows('download') || fb.isRemote()" @click="fb.copySelection(false)">
                                  <x-icon name="content_copy"></x-icon><span>Copy</span></button>
                                <button type="button" class="dropdown-item" :disabled="!fb.selectionAllows('download') || fb.isRemote()" @click="fb.chooseDestination('copy')">
                                  <x-icon name="file_copy"></x-icon><span>Copy to…</span></button>
                                <button type="button" class="dropdown-item" :disabled="!fb.selectionAllows('rename')" @click="fb.chooseDestination('move')">
                                  <x-icon name="drive_file_move"></x-icon><span>Move to…</span></button>
                                <button type="button" class="dropdown-item" :disabled="!fb.selectionAllows('download')" @click="fb.bulkDownloadFiles()">
                                  <x-icon name="download"></x-icon><span>Download</span></button>
                                <button type="button" class="dropdown-item" x-show="!fb.isRemote()" @click="showDialog('Create ZIP')">

    <style>
      .file-browser-shell {

        height: 100%;
        min-height: 0;

      .file-browser-root {

        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 400px;

      .file-browser-root:is(.is-surface, .is-embedded) {
        flex: 1 1 auto;
        min-height: 0;

      .modal-inner.file-browser-modal .file-browser-root {

      .file-browser-content {
        display: flex;
        flex-direction: column;
        padding: 0;
        gap: 0;
        min-height: 0;

      .file-browser-shell:is(.is-surface, .is-embedded) .file-browser-content {
        flex: 1 1 auto;

        border-radius: 4px;

      .files-list.is-loading .file-item {
        pointer-events: none;
      }

      .file-browser-shell:is(.is-surface, .is-embedded) .files-list,
      .modal-inner.file-browser-modal .files-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        background: var(--surface-background);
      }

      .file-browser-shell:is(.is-surface, .is-embedded) .file-header {
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .modal-inner.file-browser-modal .file-header {
        position: sticky;
        top: 0;
        z-index: 2;
      }

      /* Header Styles */
      .file-header {
        width: 100%;
        border-radius: 4px;
        overflow: hidden;
        display: grid;
        grid-template-columns:
          var(--file-columns);
        background: color-mix(in srgb, var(--color-panel) 88%, var(--color-background) 12%);

        font-weight: bold;
        color: var(--color-primary);

        align-items: center;
        justify-content: center;

        border-top: 1px solid var(--color-border);

        outline-offset: -2px;

        color: inherit;
        font: inherit;
        padding: 0;
        cursor: pointer;
      }
      .file-statusbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 3px 8px;
        font-size: var(--font-size-small);
        border-top: 1px solid var(--color-border);
      }
      .file-statusbar label { display: inline-flex; align-items: center; gap: 4px; }
      .file-statusbar [role="status"] { margin-left: auto; color: var(--color-text-muted); }
      .file-filter-input { flex: 1 1 6rem; min-width: 0; max-width: 16rem; }
      .file-item.is-cut {

      .file-select-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        min-height: 1.75rem;
      }

      .file-select-cell input {
        width: 1rem;
        height: 1rem;
        accent-color: var(--color-primary);
        cursor: pointer;
      }

      /* File Icon and Name */
      .file-icon {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        object-fit: contain;
        margin: 0 1rem 0 0.7rem;

          border-color 0.15s ease,
          box-shadow 0.15s ease,
          background-color 0.15s ease;
      }

      .path-navigator .file-browser-header-button > x-icon,
      .path-navigator .nav-button > x-icon,
      .surface-workspace .path-navigator .nav-button > x-icon,
      .surface-workspace .path-navigator .file-browser-header-button > x-icon {
        font-size: 16px;
      }

      .path-overflow-up {
        display: inline-grid;
        place-items: center;
        flex: 0 0 16px;
        width: 16px;
        min-width: 16px;
        height: 32px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--color-text);
        cursor: pointer;
      }

      .path-overflow-up.is-hidden {
        display: none;
      }

      .path-overflow-up:hover:not(:disabled),
      .path-overflow-up:focus-visible {
        color: var(--color-text-primary);
      }

      .path-overflow-up > x-icon {
        width: 16px;
        min-width: 16px;
        height: 16px;
        font-size: 16px;
        line-height: 16px;
      }

      .path-overflow-menu {
        position: fixed;
        z-index: 6000;
        display: flex;
        flex-direction: column;
        background: var(--color-background);
        border: 1px solid var(--color-border);
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        max-height: 260px;
        overflow-y: auto;
      }

      .path-ancestor {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        font-size: var(--font-size-small);
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .new-items-menu {
        width: 180px;
      }

      .new-item {
        gap: 8px;
        color: var(--color-text);
      }

      .new-item > x-icon {
        font-size: 16px;
      }

      .path-input-shell:focus-within {
        border-color: var(--color-text-secondary);
        background: var(--color-input-focus);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-text) 20%, transparent);
      }

      .path-input-shell.has-error {
        border-color: var(--color-error);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-error) 18%, transparent);
      }

      .path-input:focus {
        outline: none;
      }

      .path-error {
        color: var(--color-error);
        font-size: 0.8rem;
        padding: 0 0.25rem;
      }

      .path-edit-group,
      .path-buttons-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }

      .path-buttons-group {
        gap: 2px;
        height: 36px;
        padding: 0 4px;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        background: var(--color-input);
        cursor: text;
      }

      .path-crumbs {
        display: flex;
        align-items: center;
        gap: 0;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        cursor: text;
        scrollbar-width: none;
      }

      .path-crumbs::-webkit-scrollbar {
        display: none;
      }

      .path-crumb {
        flex: 0 0 auto;
        overflow: hidden;
        white-space: nowrap;
        height: 32px;
        padding: 0 4px;
        border-radius: 6px;
        border: 0;
        background: transparent;
        color: var(--color-text);
        font: inherit;
        font-size: var(--font-size-small);
        opacity: 0.85;
        cursor: pointer;
      }

      .path-crumb:first-child {
        padding-left: 6px;
      }

      .path-crumb:hover:not(:disabled):not(.is-active) {
        background: color-mix(in srgb, var(--color-secondary) 60%, transparent);
      }

      .path-crumb.is-active {
        font-weight: 700;
        opacity: 1;
        cursor: default;
      }

      .path-crumb.file-drop-target {
        outline: 1px solid var(--color-primary);
      }

      .path-crumb-separator {
        margin-left: 4px;
        font-weight: 300;
        opacity: 0.45;
      }

      .path-submit.is-submitting::before,
      .path-edit-toggle.is-loading::before {
        width: 13px;
        height: 13px;
        border: 2px solid color-mix(in srgb, var(--color-text) 25%, transparent);
        border-top-color: var(--color-text);
        border-radius: 50%;
        margin: 0;
        display: inline-block;
        animation: spin 1s linear infinite;
        content: "";
      }

      .path-edit-toggle:focus-visible {
        outline: 1px solid var(--color-text-secondary);
        outline-offset: 2px;
      }

      .path-edit-toggle {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--color-text);
        flex: 0 0 auto;
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        min-width: 26px;
        cursor: text;
      }

      .path-suggestions {
        position: fixed;
        background: var(--color-background);
        border: 1px solid var(--color-border);
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        /* 8 suggestion rows (38px each); the store clamps the inline viewport-aware height */
        max-height: 304px;
        overflow-y: auto;
      }

      .path-suggestion {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .path-suggestion:hover {
        background: transparent;
        opacity: 0.8;
      }

      .path-suggestion.is-active {
        background: var(--color-background-hover);
        opacity: 1;
      }

      .file-browser-footer {
        container: file-browser-footer / inline-size;
      }

      .file-browser-footer:is(.is-surface, .is-embedded) {
        display: flex;
        flex: 0 0 auto;
        justify-content: flex-end;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm);
        border-top: 1px solid var(--color-border);
        background: color-mix(in srgb, var(--color-panel) 90%, var(--color-background) 10%);
      }

      .file-browser-picker-actions {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: flex-end;
        gap: var(--spacing-sm);
        min-width: 0;
      }

      .file-browser-picker-actions .picker-filename-input {
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }

      .file-browser-picker-actions .btn {
        flex-shrink: 0;
        white-space: nowrap;
      }

      .picker-inline-error {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0;
        color: var(--color-error);
      }

      /* File Actions */
      .file-actions {
        display: flex;
        gap: var(--spacing-xs);
        justify-content: flex-end;
        padding-right: 0.5rem;
      }
      .file-actions-menu {
        margin: 0;
      }
      .file-browser-header-button {
        display: inline-grid;
        place-items: center;
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        min-width: 32px;
        min-height: 32px;
        max-height: 32px;
        box-sizing: border-box;
        padding: 0;
        border: 1px solid color-mix(in srgb, var(--color-border), transparent 12%);
        border-radius: 8px;
        background: color-mix(in srgb, var(--color-panel), var(--color-background) 16%);
        color: var(--color-text);
        cursor: pointer;
      }
      .file-browser-header-button x-icon {
        font-size: 20px;
      }
      .file-browser-header-button:hover,
      .file-browser-header-button[aria-pressed="true"] {
        background: color-mix(in srgb, var(--color-text) 8%, var(--color-panel));
      }
      .file-browser-header-button.path-submit {
        flex: 0 0 auto;
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        min-width: 26px;
        min-height: 26px;
        max-height: 26px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        opacity: 0.65;
        cursor: text;
      }
      .file-browser-header-button.path-submit:hover:not(:disabled),
      .file-browser-header-button.path-submit:focus-visible {
        background: transparent;
        opacity: 0.65;
      }
      .file-browser-header-button.path-submit:disabled {
        opacity: 0.65;
        cursor: text;
      }
      .file-browser-header-button:focus-visible {
        outline: 1px solid var(--color-text-secondary);
        outline-offset: 2px;
      }
      .path-navigator .nav-button-label {
        display: none;
      }
      .nav-history-button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .file-commandbar {
        display: flex;
        flex: none;
        align-items: center;
        gap: 3px;
        padding: 3px 6px;
        border-bottom: 1px solid var(--color-border);
      }
      .file-commandbar [aria-label="Refresh files"], .file-commandbar [aria-label="Toggle file tree"] { margin-inline-start: 5px; border-inline-start: 1px solid var(--color-border); }
      .file-commandbar [aria-label="Parent folder"], .file-commandbar [aria-label="Home folder"], .file-commandbar [aria-label="Open Trash"] { color: var(--color-primary); }
      .file-commandbar [hidden] { display: none !important; }
      .file-browser-workspace {
        display: flex;
        flex: 1;
        min-height: 0;
        min-width: 0;
        position: relative;
        overflow: hidden;
      }
      .file-browser-list-pane {
        container: file-browser / inline-size;
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 0 6px;
      }
      .file-details-dialog { color: var(--color-text); background: var(--color-panel); border: 1px solid var(--color-border); border-radius: 8px; padding: 1rem; width: min(26rem, 90vw); max-height: 80dvh; overflow: auto; }
      .files-media-dialog { width: min(48rem, 94vw); }
      .files-media-dialog > strong { display: block; overflow-wrap: anywhere; margin-block: 0.5rem; }
      .files-media-dialog .file-dialog-buttons { margin: 0; }
      .file-media-content { overflow: auto; max-height: 60dvh; overscroll-behavior: contain; }
      .file-media-content img, .file-media-content video { display: block; max-width: 100%; max-height: 60dvh; margin: auto; }
      .file-media-content.original-size img { max-width: none; max-height: none; }
      .file-details-dialog::backdrop { background: #0008; }
      .file-details-dialog h3 { margin-top: 0; }
      .file-details-dialog .btn-cancel { margin-top: 1rem; }
      .file-properties { margin: 0; }
      .file-properties > div { display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: .75rem; padding: .3rem 0; }
      .file-properties dt { color: var(--color-text-secondary); }
      .file-properties dd { margin: 0; overflow-wrap: anywhere; }
      .file-permissions { display: flex; align-items: end; gap: .75rem; border-top: 1px solid var(--color-border); margin-top: .75rem; padding-top: .75rem; }
      .file-permissions label { display: grid; gap: .25rem; }
      .file-permissions input { width: 7rem; font: inherit; }
      .file-detail-list { display: grid; gap: 0.75rem; overflow-wrap: anywhere; }
      .file-detail-list label, .file-dialog-buttons, .file-operation { display: flex; align-items: center; gap: 0.5rem; }
      .file-dialog-buttons { margin-top: 0.75rem; flex-wrap: wrap; }
      .file-operation { padding: 0.25rem 0.5rem; font-size: var(--font-size-small); }
      .file-operation progress { height: 4px; accent-color: var(--color-highlight); }
      @container file-browser (min-width: 621px) {
        .file-select-cell, .file-cell-select { display: none; }
      }
      .files-list:not(.file-icons-view) .file-item.selected { box-shadow: inset 1px 0 var(--color-highlight), inset -1px 0 var(--color-highlight); border-top-color: transparent; }
      .files-list:not(.file-icons-view) :not(.selected) + .file-item.selected { border-radius: 4px 4px 0 0; border-top-color: var(--color-highlight); }
      .files-list:not(.file-icons-view) .file-item.selected:not(:has(+ .selected)) { border-radius: 0 0 4px 4px; border-bottom: 1px solid var(--color-highlight); padding-bottom: 4px; }
      @container file-browser (max-width: 620px) {
        .files-list { --file-columns: 44px minmax(0, 1fr) 4.5rem 36px; }
        .file-cell-date, .file-date { display: none; }
        .file-select-cell { min-height: 44px; }
        .file-actions { padding-right: 0; }
        .file-icon { margin: 0 0.5rem 0 0.25rem; }
      }
      @container file-browser (max-width: 400px) {
        .path-navigator { flex-wrap: wrap; }
        .path-edit-group,
        .path-buttons-group { flex-basis: calc(100% - 88px); }
        .path-navigator > .surface-toolbar-separator { display: none; }

      }
      @container file-browser-footer (max-width: 620px) {
        .file-browser-picker-actions {
          flex-wrap: wrap;
          justify-content: stretch;
        }
        .picker-inline-label {
          flex-basis: 100%;
        }
        .file-browser-picker-actions .picker-filename-input {
          flex-basis: 100%;
        }
        .picker-confirm-button {
          flex: 1 1 auto;
        }
      }
      .files-list.file-icons-view {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
        align-content: start;
        gap: var(--spacing-sm);
      }
      .file-icons-view .file-header {
        grid-column: 1 / -1;
      }
      .file-icons-view .file-header .file-cell-size,
      .file-icons-view .file-header .file-cell-date,
      .file-icons-view .file-header .file-cell-actions {
        display: none;
      }
      .file-icons-view .file-item {
        grid-template-columns: 1fr;
        position: relative;
        padding: var(--spacing-sm);
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius-sm);
        gap: var(--spacing-sm);
      }
      .file-icons-view .file-select-cell {
        position: absolute;
        top: var(--spacing-sm);
        left: var(--spacing-sm);
      }
      .file-icons-view .file-name {
        flex-direction: column;
        max-height: none;
        margin: 0;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm);
        text-align: center;
      }
      .file-icons-view .file-name span {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .file-icons-view .file-icon {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
        margin: 0;
        font-size: 48px;
      }
      .file-icons-view .file-size,
      .file-icons-view .file-date {
        display: none;
      }
      .file-icons-view .file-actions {
        justify-content: center;
        padding: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .file-item,
        .file-icon,
        .nav-button .material-symbols-outlined {
          transition: none;
        }
      }
    </style>
  </body>
</html>
