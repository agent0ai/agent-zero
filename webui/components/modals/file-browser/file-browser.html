<html
  class="surface-modal file-browser-modal modal-no-backdrop"
  data-surface-id="files"
  data-surface-modal-path="modals/file-browser/file-browser.html"
  data-surface-dock-title="Open Files in canvas"
  data-surface-dock-icon="dock_to_right"
  data-canvas-surface="files"
  data-canvas-modal-path="modals/file-browser/file-browser.html"
  data-canvas-dock-title="Open Files in canvas"
  data-canvas-dock-icon="dock_to_right"
>
  <head>
    <title>File Browser</title>
    <script type="module">
      import { store } from "/components/modals/file-browser/file-browser-store.js";
    </script>
  </head>
  <body class="file-browser-modal-body">
    <div
      x-data="{
        owner: xAttrs($el)?.owner || 'fileBrowser', mounted: null,
        get fb() { return this.owner === 'fileBrowser' ? $store.fileBrowser.current : $store[this.owner]; },
        mount() {
          const next = this.fb;
          if (this.mounted?.viewName === next?.viewName) return;
          this.mounted?.onUnmount(this.$el);
          this.mounted = next;
          next?.onMount(this.$el, xAttrs(this.$el) || {});
        }
      }"
      class="file-browser-shell surface-workspace"
      :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas', 'is-embedded': xAttrs($el)?.mode === 'embedded' }"
      x-effect="mount()"
      x-destroy="mounted?.onUnmount($el)"
    >
      <template x-if="fb">
        <div
          class="file-browser-root"
          x-data="{
            pathRoot: $el, menu: '', menuStyle: {}, menuTrigger: null, crumbsOverflow: 0,
            closeMenu(restoreFocus = false) { this.menu = ''; this.menuStyle = {}; if (restoreFocus) this.menuTrigger?.focus(); },
            toggleMenu(name, trigger, width) {
              const opening = this.menu !== name;
              this.closeMenu();
              fb.closeDropdown();
              if (opening) {
                this.menuTrigger = trigger; this.menuStyle = fb.getDropdownStyle(trigger, width); this.menu = name;
                $nextTick(() => Array.from($refs[name + 'Menu']?.querySelectorAll('button') || []).find(button => button.checkVisibility())?.focus({preventScroll: true}));
              }
            }
          }"
          x-effect="fb.fileTree.follow(fb.browser.currentPath); fb.isLoading; closeMenu()"
          @resize.window="closeMenu(); fb.clearPathSuggestions()"
          @scroll.window.capture="if (!$event.target.closest?.('.path-navigator, .path-suggestions, .path-overflow-menu')) { closeMenu(); fb.clearPathSuggestions(); }"
          @keydown.escape.window.capture="if (menu) { $event.stopPropagation(); closeMenu(true); }"
          :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas', 'is-embedded': fb.embedded }"
        >
          <!-- File Browser Content -->
          <div class="file-browser-content">
            <!-- Path navigator -->
            <div class="path-navigator-wrap">
              <form class="path-navigator surface-toolbar" @submit.prevent="fb.submitPath()">
                <button
                  type="button"
                  class="file-browser-header-button surface-control nav-history-button"
                  @click="fb.navigateBack()"
                  :disabled="!fb.history.length || fb.isLoading"
                  aria-label="Go back"
                  title="Go back"
                >
                  <x-icon aria-hidden="true" name="arrow_back"></x-icon>
                </button>
                <button
                  type="button"
                  class="file-browser-header-button surface-control nav-history-button"
                  @click="fb.navigateForward()"
                  :disabled="!fb.forwardHistory.length || fb.isLoading"
                  aria-label="Go forward"
                  title="Go forward"
                >
                  <x-icon aria-hidden="true" name="arrow_forward"></x-icon>
                </button>
                <template x-if="fb.preferences.pathBar === 'raw' || fb.pathEditing">
                  <div class="path-edit-group">
                    <button
                      type="button"
                      class="nav-button back-button surface-control"
                      x-show="fb.preferences.pathBar === 'raw'"
                      @click="fb.navigateUp()"
                      @dragover="fb.setDropTarget(fb.browser.parentPath, $event)"
                      @dragleave="fb.clearDropTarget(fb.browser.parentPath, $event)"
                      @drop="fb.dropItems(fb.browser.parentPath, 'parent folder', $event)"
                      :class="{ 'is-drop-target': fb.dragOverPath === fb.browser.parentPath }"
                      :disabled="!fb.browser.parentPath || fb.isLoading"
                      aria-label="Navigate up"
                      title="Navigate up"
                    >
                      <x-icon aria-hidden="true" name="arrow_upward"></x-icon>
                      <span class="nav-button-label">Up</span>
                    </button>
                    <div class="path-input-shell" :class="{ 'has-error': fb.pathError }" @mousedown.self.prevent @click.self="fb.focusPathInput($el)">
                      <input
                        class="path-input"
                        type="text"
                        x-model="fb.pathInput"
                        x-create="fb.pinPathInput($el); if (fb.pathEditing) $nextTick(() => { if ($el.checkVisibility({checkOpacity: true})) $el.focus(); })"
                        x-effect="fb.pathInput; fb.scrollPathInputNextFrame($el)"
                        x-destroy="$el._pinResizeObserver?.disconnect()"
                        @input="fb.queuePathSuggestions($el)"
                        @focus="fb.showPathSuggestions($el)"
                        @blur="fb.hidePathSuggestions(); fb.pinPathInputAfterBlur($el)"
                        @keydown.arrow-down="if (fb.movePathSuggestion(1)) $event.preventDefault()"
                        @keydown.arrow-up="if (fb.movePathSuggestion(-1)) $event.preventDefault()"
                        @keydown.tab="if (!$event.shiftKey && fb.selectPathSuggestion($el)) { $event.preventDefault(); $el.focus(); }"
                        @keydown.escape.stop.prevent="fb.exitPathEdit(true)"
                        :aria-invalid="fb.pathError ? 'true' : 'false'"
                        aria-label="Directory path"
                        spellcheck="false"
                        autocomplete="off"
                      />
                      <button
                        :type="fb.pathEditing ? 'submit' : 'button'"
                        class="file-browser-header-button path-submit"
                        @mousedown.prevent
                        @click="if (!fb.pathEditing) fb.focusPathInput($el)"
                        :class="{ 'is-submitting': fb.isPathSubmitting || fb.isLoading }"
                        :disabled="fb.isPathSubmitting || fb.isLoading"
                        :aria-label="fb.pathEditing ? 'Go to directory' : 'Edit directory path'"
                      >
                      </button>
                    </div>
                  </div>
                </template>
                <template x-if="fb.preferences.pathBar !== 'raw' && !fb.pathEditing">
                  <div class="path-buttons-group" @click.self="fb.startPathEdit()">
                    <button
                      type="button"
                      class="path-overflow-up"
                      :class="{ 'is-hidden': !crumbsOverflow }"
                      @click="toggleMenu('ancestors', $el, 220)"
                      :disabled="!fb.browser.parentPath || fb.isLoading"
                      :aria-expanded="menu === 'ancestors' ? 'true' : 'false'"
                      aria-label="Parent folders"
                      title="Parent folders"
                    >
                      <x-icon aria-hidden="true" name="chevron_left"></x-icon>
                    </button>
                    <template x-teleport="body">
                      <div
                        class="path-overflow-menu"
                        x-ref="ancestorsMenu"
                        x-show="menu === 'ancestors'"
                        :style="menuStyle"
                        @click.outside="closeMenu()"
                      >
                        <template x-for="ancestor in fb.pathCrumbs().slice(0, crumbsOverflow)" :key="ancestor.path">
                          <button type="button" class="path-ancestor dropdown-item" @click="closeMenu(); fb.navigateToFolder(ancestor.path)">
                            <x-icon aria-hidden="true" name="folder"></x-icon><span x-text="ancestor.name"></span>
                          </button>
                        </template>
                      </div>
                    </template>
                    <div
                      class="path-crumbs"
                      role="navigation"
                      aria-label="Directory path"
                      x-data="{ measure() { requestAnimationFrame(() => { crumbsOverflow = fb.measurePathCrumbFit($el, crumbsOverflow); }); } }"
                      x-create="$el._crumbFitObserver = new ResizeObserver(() => measure()); $el._crumbFitObserver.observe($el)"
                      x-destroy="$el._crumbFitObserver.disconnect()"
                      x-effect="fb.pathCrumbs(); measure()"
                      @click.self="fb.startPathEdit()"
                    >
                      <template x-for="(crumb, index) in fb.pathCrumbs()" :key="crumb.path">
                        <button
                          type="button"
                          class="path-crumb"
                          :class="{ 'is-active': index === fb.pathCrumbs().length - 1, 'is-drop-target': fb.dragOverPath === crumb.path }"
                          @click="fb.navigateToFolder(crumb.path)"
                          @dragover="fb.setDropTarget(crumb.path, $event)"
                          @dragleave="fb.clearDropTarget(crumb.path, $event)"
                          @drop="fb.dropItems(crumb.path, crumb.name, $event)"
                          :disabled="fb.isLoading"
                        >
                          <span class="path-crumb-name" x-text="crumb.name"></span
                          ><span class="path-crumb-separator" aria-hidden="true" x-show="index < fb.pathCrumbs().length - 1">›</span>
                        </button>
                      </template>
                    </div>
                    <button type="button" class="path-edit-toggle" :class="{ 'is-loading': fb.isLoading }"
                      :disabled="fb.isLoading" aria-label="Edit directory path" @click="fb.startPathEdit()">
                    </button>
                  </div>
                </template>
                <template x-teleport="body">
                  <div
                    class="path-suggestions"
                    x-show="fb.pathSuggestions.length && fb.pathSuggestionsOwner?.closest('.file-browser-root') === pathRoot && !fb.pathError"
                    :style="fb.pathSuggestionsStyle"
                    x-effect="$el._fileBrowserOwner = fb.viewName"
                  >
                    <template x-for="(suggestion, index) in fb.pathSuggestions" :key="suggestion.path">
                      <button
                        type="button"
                        class="path-suggestion dropdown-item"
                        :class="{ 'is-active': index === fb.pathSuggestionIndex }"
                        @mousedown.prevent
                        @click="fb.pickPathSuggestion(suggestion)"
                        @mouseenter="fb.pathSuggestionIndex = index"
                      >
                        <x-icon aria-hidden="true" name="folder"></x-icon><span x-text="suggestion.name"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <span class="surface-toolbar-separator" aria-hidden="true" x-show="!fb.isTextOpenPicker()"></span>
                <button
                  type="button"
                  class="file-browser-header-button btn-new-item surface-control"
                  x-show="fb.remoteAllowed('upload') && !fb.isTextOpenPicker()"
                  @click="toggleMenu('new', $el, 180)"
                  :aria-expanded="menu === 'new' ? 'true' : 'false'"
                  aria-label="Create new"
                  title="Create new"
                >
                  <x-icon aria-hidden="true" name="add"></x-icon>
                </button>
                <template x-teleport="body">
                  <div
                    class="path-overflow-menu new-items-menu"
                    x-ref="newMenu"
                    x-show="menu === 'new'"
                    :style="menuStyle"
                    @click.outside="closeMenu()"
                  >
                    <button
                      type="button"
                      class="new-item dropdown-item"
                      x-show="!fb.isPickerMode() && fb.remoteAllowed('upload') && fb.remoteAllowed('edit')"
                      @click="closeMenu(); fb.openNewFile()"
                      aria-label="New file"
                      title="New file"
                    >
                      <x-icon aria-hidden="true" name="note_add"></x-icon><span>New file</span>
                    </button>
                    <button
                      type="button"
                      class="new-item dropdown-item"
                      x-show="!fb.isTextOpenPicker() && fb.remoteAllowed('upload')"
                      @click="closeMenu(); fb.beginNewFolder()"
                      aria-label="New folder"
                      title="New folder"
                    >
                      <x-icon aria-hidden="true" name="create_new_folder"></x-icon><span>New folder</span>
                    </button>
                  </div>
                </template>
                <span class="surface-toolbar-separator" aria-hidden="true"></span>
                <button
                  type="button"
                  class="file-browser-header-button surface-control"
                  title="Toggle file tree"
                  aria-label="Toggle file tree"
                  :aria-pressed="String(fb.fileTree.shown)"
                  @click="fb.fileTree.toggle(fb.browser.currentPath)"
                >
                  <x-icon name="account_tree"></x-icon>
                </button>
                <button
                  type="button"
                  class="file-browser-header-button surface-control"
                  x-show="!fb.isPickerMode()"
                  @click="fb.openSettings()"
                  title="File Browser Settings"
                  aria-label="File Browser Settings"
                >
                  <x-icon aria-hidden="true" name="settings"></x-icon>
                </button>
              </form>
              <template x-if="fb.pathError">
                <div class="path-error" x-text="fb.pathError"></div>
              </template>
            </div>
            <div x-show="fb.selectedCount > 0 && !fb.isPickerMode()" class="mass-action-toolbar file-mass-toolbar">
              <div class="selection-summary">
                <button
                  type="button"
                  class="selection-close"
                  @click="fb.clearSelection()"
                  :disabled="fb.isBulkBusy"
                  title="Clear Selection"
                  aria-label="Clear selection"
                >
                  <x-icon name="close"></x-icon>
                </button>
                <div class="selection-info" x-text="fb.selectedCountLabel"></div>
              </div>

              <div class="mass-actions">
                <button
                  type="button"
                  class="btn btn-mass export"
                  @click="fb.bulkDownloadFiles()"
                  :disabled="fb.isBulkBusy"
                  title="Download Selected Items"
                  x-show="fb.remoteAllowed('download')"
                >
                  <x-icon name="folder_zip"></x-icon>
                  Download ZIP
                </button>

                <button
                  type="button"
                  class="btn btn-mass delete"
                  @click="$confirmClick($event, () => fb.bulkDeleteFiles())"
                  :disabled="fb.isBulkBusy"
                  title="Delete Selected Items"
                  x-show="fb.remoteAllowed('delete')"
                  aria-label="Delete selected items"
                >
                  <x-icon name="delete"></x-icon>
                </button>
              </div>
            </div>

            <div class="file-browser-workspace">
              <div class="file-browser-list-pane">
                <!-- Files list -->
                <div
                  class="files-list"
                  :inert="fb.isLoading || fb.isRenaming || fb.isBulkBusy"
                  :class="{ 'file-icons-view': fb.preferences.view === 'icons', 'is-loading': fb.isLoading }"
                  @scroll="fb.closeDropdown(); closeMenu()"
                >
                  <div class="file-header">
                    <div class="file-cell-select">
                      <input
                        type="checkbox"
                        :checked="fb.allVisibleSelected"
                        :indeterminate="fb.someVisibleSelected && !fb.allVisibleSelected"
                        @change="fb.toggleSelectAllVisible()"
                        :disabled="fb.selectableEntries.length === 0"
                        title="Select visible items"
                        aria-label="Select visible items"
                      />
                    </div>
                    <div class="file-cell" @click="fb.toggleSort('name')">
                      Name
                      <span
                        x-show="fb.browser.sortBy === 'name'"
                        x-text="fb.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                    </div>
                    <div class="file-cell-size" @click="fb.toggleSort('size')">
                      Size
                      <span
                        x-show="fb.browser.sortBy === 'size'"
                        x-text="fb.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                    </div>
                    <div class="file-cell-date" @click="fb.toggleSort('date')">
                      Modified
                      <span
                        x-show="fb.browser.sortBy === 'date'"
                        x-text="fb.browser.sortDirection === 'asc' ? '↑' : '↓'"
                      ></span>
                    </div>
                    <div class="file-cell-actions"></div>
                  </div>

                  <!-- File list entries -->
                  <template x-if="fb.visibleEntries.length">
                    <template x-for="file in fb.visibleEntries" :key="file.path">
                      <div
                        class="file-item"
                        @click="fb.handleFileNameClick(file)"
                        :data-is-dir="file.is_dir"
                        :draggable="!fb.isPickerMode() && !fb.isBulkBusy"
                        :class="{
                        'selected': file.selected,
                        'is-dragging': fb.isDraggingPath(file.path),
                        'is-drop-target': file.is_dir && fb.dragOverPath === file.path
                      }"
                        @dragstart="fb.startDrag(file, $event)"
                        @dragend="fb.clearDragState()"
                        @dragover="file.is_dir && fb.setDropTarget(file.path, $event)"
                        @dragleave="file.is_dir && fb.clearDropTarget(file.path, $event)"
                        @drop="file.is_dir && fb.dropItems(file.path, file.name, $event)"
                      >
                        <label class="file-select-cell" @click.stop>
                          <template x-if="!fb.isTextOpenPicker() || !file.is_dir">
                            <input
                              type="checkbox"
                              x-model="file.selected"
                              :disabled="!fb.isSelectableEntry(file)"
                              :aria-label="`Select ${file.name}`"
                            />
                          </template>
                        </label>
                        <div class="file-name">
                          <template x-if="file.is_dir">
                            <x-icon name="folder" class="file-icon file-folder-icon"></x-icon>
                          </template>
                          <template x-if="!file.is_dir">
                            <img
                              :src="'/public/' + (file.type === 'unknown' ? 'file' : (fb.isArchive(file.name) ? 'archive' : file.type)) + '.svg'"
                              class="file-icon"
                              :alt="file.type"
                              draggable="false"
                            />
                          </template>
                          <span x-text="file.name"></span>
                        </div>
                        <div class="file-size" x-text="file.is_dir ? '—' : fb.formatFileSize(file.size)"></div>
                        <div class="file-date" x-text="fb.formatDate(file.modified)"></div>
                        <div class="file-actions" x-data="{ fileActions: $el }" x-show="!fb.isPickerMode()" @click.stop>
                          <!-- Secondary single-item actions (Rename/...) are grouped under a dropdown -->
                          <div
                            class="dropdown file-actions-dropdown"
                            @click.outside="fb.closeDropdown()"
                            @keydown.escape.window="fb.closeDropdown()"
                          >
                            <button
                              type="button"
                              class="btn-icon-action dropdown-trigger"
                              @click.stop="fb.toggleDropdown(file.path, $event.currentTarget)"
                              :aria-expanded="fb.isDropdownOpen(file.path, fileActions).toString()"
                              aria-label="More actions"
                              title="More actions"
                            >
                              <x-icon name="more_vert"></x-icon>
                            </button>

                            <template x-teleport="body">
                              <div
                                class="dropdown-menu file-actions-menu"
                                x-show="fb.isDropdownOpen(file.path, fileActions)"
                                x-transition
                                :style="fb.dropdownStyle"
                                style="display: none"
                                @click.stop="fb.closeDropdown()"
                              >
                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="fb.isEditableFile(file)"
                                  @click="fb.openFileEditor(file)"
                                >
                                  <x-icon name="edit"></x-icon>
                                  <span>Edit</span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="fb.canOpenInActionMenu(file)"
                                  @click="fb.openInSurface(file)"
                                  :title="fb.surfaceActionTitle(file)"
                                >
                                  <x-icon :name="fb.surfaceActionIcon(file)"></x-icon>
                                  <span x-text="fb.surfaceActionLabel(file)"></span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="file.is_dir && fb.remoteAllowed('download', file)"
                                  @click="fb.downloadFile(file)"
                                >
                                  <x-icon name="folder_zip"></x-icon>
                                  <span>Download ZIP</span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="!file.is_dir && !fb.isRemote(file.path) && fb.isArchive(file.name)"
                                  @click="fb.extractArchive(file)"
                                >
                                  <x-icon name="unarchive"></x-icon>
                                  <span>Extract</span>
                                </button>

                                <button
                                  type="button"
                                  class="dropdown-item"
                                  x-show="fb.remoteAllowed('rename', file)"
                                  @click="fb.beginRename(file)"
                                >
                                  <x-icon name="drive_file_rename_outline"></x-icon>
                                  <span>Rename</span>
                                </button>
                                <template x-if="fb.isDropdownOpen(file.path, fileActions)">
                                  <template x-if="!fb.embedded"><x-extension id="file-browser-actions-menu"></x-extension></template>
                                </template>
                              </div>
                            </template>
                          </div>
                          <button
                            class="btn-icon-action"
                            x-show="!file.is_dir && fb.remoteAllowed('download', file)"
                            @click.stop="fb.downloadFile(file)"
                            title="Download file"
                            aria-label="Download file"
                          >
                            <x-icon name="download"></x-icon>
                          </button>
                          <button
                            class="btn-icon-action danger"
                            x-show="fb.remoteAllowed('delete', file)"
                            @click.stop="$confirmClick($event, () => fb.deleteFile(file))"
                            title="Delete item"
                            aria-label="Delete item"
                          >
                            <x-icon name="delete"></x-icon>
                          </button>
                        </div>
                      </div>
                    </template>
                  </template>

                  <!-- Empty state -->
                  <template x-if="!fb.browser.entries.length && !fb.isLoading">
                    <div class="no-files">No files found</div>
                  </template>
                  <template x-if="fb.browser.entries.length && !fb.visibleEntries.length">
                    <div class="no-files">
                      <div>No matching files found</div>
                      <button class="btn btn-cancel btn-clear-search" @click="fb.clearSearch()">
                        <x-icon name="close"></x-icon>
                        Clear
                      </button>
                    </div>
                  </template>
                </div>
              </div>
              <div class="file-tree-host" x-show="fb.fileTree.shown" style="display: none">
                <x-component path="modals/file-browser/file-tree.html" :owner="owner"></x-component>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- Modal Footer (outside template x-if so it exists immediately) -->
      <template x-if="fb">
        <div class="modal-footer file-browser-footer" data-modal-footer
          x-data="{ footerOwner: xAttrs($el)?.owner || 'fileBrowser', get fb() { return this.footerOwner === 'fileBrowser' ? $store.fileBrowser.current : $store[this.footerOwner]; } }"
          :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas', 'is-embedded': fb.embedded }">
          <div class="file-browser-picker-actions" x-show="fb.isPickerMode() || fb.renameInline" style="display: none">
            <template x-if="fb.renameInline">
              <span class="picker-inline-label" x-text="fb.renameMode === 'create-folder' ? 'New folder' : 'Rename'"></span>
            </template>
            <template x-if="fb.isSaveAsPicker() && !fb.renameInline">
              <input
                type="text"
                class="picker-filename-input"
                x-model="fb.pickerFilename"
                @input="fb.onPickerFilenameInput()"
                @keydown.enter.prevent="fb.confirmPicker()"
                placeholder="File name"
                aria-label="File name"
                spellcheck="false"
              />
            </template>
            <template x-if="fb.renameInline">
              <input
                type="text"
                class="picker-filename-input"
                x-model="fb.renameName"
                x-create="$nextTick(() => { if ($el.checkVisibility({checkOpacity: true})) { $el.focus(); $el.select(); } })"
                :disabled="fb.isRenaming"
                @keydown.escape.stop.prevent="fb.closeRenameModal()"
                @keydown.enter.prevent="fb.confirmRename()"
                :placeholder="fb.renameMode === 'create-folder' ? 'Folder name' : 'New name'"
                :aria-label="fb.renameMode === 'create-folder' ? 'Folder name' : 'New name'"
                spellcheck="false"
              />
            </template>
            <template x-if="fb.pickerFilenameError && !fb.renameInline">
              <span class="picker-inline-error" x-text="fb.pickerFilenameError"></span>
            </template>
            <template x-if="fb.renameError">
              <span class="picker-inline-error" x-text="fb.renameError"></span>
            </template>
            <button
              type="button"
              class="btn btn-ok picker-confirm-button"
              :disabled="fb.renameInline
                ? (fb.isRenaming || fb.isLoading || !fb.renameName.trim())
                : (!fb.canConfirmPicker() || fb.isBulkBusy || fb.isLoading)"
              @click="fb.renameInline ? fb.confirmRename() : fb.confirmPicker()"
              x-text="fb.renameInline ? (fb.renameMode === 'create-folder' ? 'Create Folder' : 'Rename') : fb.pickerConfirmLabel"
            ></button>
            <button type="button" class="btn btn-cancel" :disabled="fb.isBulkBusy || fb.isRenaming" @click="fb.renameInline ? fb.closeRenameModal() : fb.cancelPicker()">Cancel</button>
          </div>
          <label class="btn btn-upload" x-show="!fb.isPickerMode() && !fb.renameInline && fb.remoteAllowed('upload')">
