<html>
<head>
  <title>Rename</title>
  <script type="module">
    import { store } from "/components/modals/file-browser/file-browser-store.js";
  </script>
</head>
<body>
  <div x-data="{ fb: $store.fileBrowser.renameView }">
    <template x-if="fb">
      <div class="rename-modal-root" x-destroy="fb.releaseRenameModal()" x-init="$nextTick(() => $refs.renameInput?.focus())">
        <div class="rename-form">
          <label class="rename-label" x-text="fb.renameMode === 'create-folder' ? 'New folder name' : 'New name'"></label>
          <input
            class="rename-input"
            type="text"
            x-ref="renameInput"
            x-model="fb.renameName"
            @keydown.enter.prevent="fb.confirmRename()"
            :disabled="fb.isRenaming"
          />
          <template x-if="fb.renameError">
            <p class="rename-error" x-text="fb.renameError"></p>
          </template>
          <p class="rename-hint" x-text="fb.renameMode === 'create-folder' ? 'Folder will be created in the current directory.' : 'Renaming will keep the item in the same directory.'"></p>
        </div>
      </div>
    </template>
  </div>

  <template x-if="$store.fileBrowser">
    <div class="modal-footer" data-modal-footer x-data="{ fb: $store.fileBrowser.renameView }">
      <button class="btn btn-ok" @click="fb.confirmRename()" :disabled="fb.isRenaming || !fb.renameName.trim()" x-text="fb.renameMode === 'create-folder' ? 'Create Folder' : 'Rename'"></button>
      <button class="btn btn-cancel" @click="fb.closeRenameModal()" :disabled="fb.isRenaming">Cancel</button>
    </div>
  </template>

  <style>
    .rename-modal-root {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      width: 100%;
    }

    .rename-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      margin: 1rem;
    }

    .rename-label {
      font-weight: 600;
      color: var(--color-text);
    }

    .rename-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-background);
      color: var(--color-text);
    }

    .rename-input:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .rename-hint {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: 0.85rem;
    }

    .rename-error {
      margin: 0;
      color: var(--color-accent);
      font-weight: 500;
      font-size: 0.85rem;
    }
  </style>
</body>
</html>
